<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cochera · Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f4fa; --surface:#fff; --card:#fff; --card2:#f7f9fd;
  --navy:#1a3a6b; --navy2:#0d2250;
  --navy-dim:rgba(26,58,107,0.08); --navy-mid:rgba(26,58,107,0.18);
  --green:#0a9e6e; --green-dim:rgba(10,158,110,0.10); --green-mid:rgba(10,158,110,0.22);
  --yellow:#b07800; --yellow-dim:rgba(176,120,0,0.10); --yellow-mid:rgba(176,120,0,0.22);
  --red:#c8192e; --red-dim:rgba(200,25,46,0.08); --red-mid:rgba(200,25,46,0.20);
  --text:#0d1e3a; --muted:#8a9ab8; --border:#dde4f0;
  --shadow-sm:0 2px 8px rgba(26,58,107,0.07);
  --shadow:0 6px 24px rgba(26,58,107,0.11);
  --shadow-lg:0 16px 48px rgba(26,58,107,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}

.app{display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
.header{background:var(--navy2);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(13,34,80,0.3);}
.logo{display:flex;align-items:center;gap:11px;}
.logo-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#4a7fd4,#2256b0);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.logo-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:1.5px;}
.logo-sub{font-size:9px;color:rgba(255,255,255,0.38);letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
.nav{display:flex;gap:3px;}
.nav-btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:12px;transition:all 0.18s;background:transparent;color:rgba(255,255,255,0.45);}
.nav-btn.active{background:rgba(255,255,255,0.13);color:#fff;}
.nav-btn:hover:not(.active){background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.8);}

/* ALERT BAR */
.alert-bar{background:linear-gradient(90deg,rgba(200,25,46,0.07),rgba(200,25,46,0.02));border-bottom:1.5px solid rgba(200,25,46,0.2);padding:8px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.alert-pulse{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse-dot 1.5s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(200,25,46,0.5);}60%{box-shadow:0 0 0 6px rgba(200,25,46,0);}}

main{flex:1;padding:24px;max-width:1120px;margin:0 auto;width:100%;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow-sm);transition:all 0.2s;}
.kpi-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.kpi-icon{font-size:20px;margin-bottom:8px;}
.kpi-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.kpi-value{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;}
.kpi-value.navy{color:var(--navy);}
.kpi-value.green{color:var(--green);}
.kpi-value.yellow{color:var(--yellow);}
.kpi-value.red{color:var(--red);}

/* BANNER */
.fact-banner{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
.fact-banner .t{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--navy);}
.fact-banner .s{color:var(--muted);font-size:12px;margin-top:3px;}

/* SEC TITLE */
.sec-title{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* CLIENT ROW */
.client-row{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:7px;cursor:pointer;transition:all 0.15s;box-shadow:var(--shadow-sm);}
.client-row:hover{box-shadow:var(--shadow);border-color:var(--navy);transform:translateX(2px);}
.client-row.st-yellow{border-left:3px solid var(--yellow);}
.client-row.st-red{border-left:3px solid var(--red);}
.client-row.st-green{border-left:3px solid var(--green);}

/* STATUS PILL */
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.status-pill.green{background:var(--green-dim);color:var(--green);}
.status-pill.yellow{background:var(--yellow-dim);color:var(--yellow);}
.status-pill.red{background:var(--red-dim);color:var(--red);}
.sp-dot{width:5px;height:5px;border-radius:50%;}
.status-pill.green .sp-dot{background:var(--green);}
.status-pill.yellow .sp-dot{background:var(--yellow);animation:blink-y 1.4s ease-in-out infinite;}
.status-pill.red .sp-dot{background:var(--red);animation:blink-r 1s ease-in-out infinite;}
@keyframes blink-y{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes blink-r{0%,100%{opacity:1;}50%{opacity:0.15;}}

.c-info{flex:1;min-width:0;}
.c-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-sub{color:var(--muted);font-size:11px;margin-top:2px;}
.c-saldo{text-align:right;flex-shrink:0;}
.c-saldo-num{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;}
.c-saldo-num.green{color:var(--green);}
.c-saldo-num.yellow{color:var(--yellow);}
.c-saldo-num.red{color:var(--red);}
.c-saldo-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.c-arrow{color:var(--muted);font-size:16px;flex-shrink:0;}

/* COCHERA TAGS */
.cochera-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.cochera-tag{background:var(--navy-dim);color:var(--navy);border:1px solid var(--navy-mid);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;}
.cochera-tag.inactiva{background:var(--red-dim);color:var(--red);border-color:var(--red-mid);text-decoration:line-through;opacity:0.6;}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;transition:all 0.18s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-navy{background:var(--navy2);color:#fff;box-shadow:0 3px 10px rgba(13,34,80,0.2);}
.btn-navy:hover{background:var(--navy);transform:translateY(-1px);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#089060;transform:translateY(-1px);}
.btn-wa{background:#25D366;color:#fff;}
.btn-wa:hover{background:#1db954;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px;}
.btn-or{background:var(--red-dim);color:var(--red);border:1px solid var(--red-mid);}
.btn-on{background:var(--navy-dim);color:var(--navy);border:1px solid var(--navy-mid);}
.btn-og{background:var(--green-dim);color:var(--green);border:1px solid var(--green-mid);}
.btn-oy{background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow-mid);}

/* MANAGE ROW */
.manage-row{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:7px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
.manage-avatar{width:40px;height:40px;border-radius:9px;flex-shrink:0;background:var(--navy-dim);display:flex;align-items:center;justify-content:center;font-size:18px;}
.manage-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-hdr h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--navy);}

/* CC HEADER */
.cc-hdr{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:18px 22px;display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
.cc-avatar{width:50px;height:50px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(13,34,80,0.2);}
.cc-name{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--navy);}
.cc-sub{color:var(--muted);font-size:12px;margin-top:3px;}
.cc-saldo-box{text-align:center;padding:12px 18px;border-radius:10px;flex-shrink:0;min-width:140px;}
.cc-saldo-box.green{background:var(--green-dim);border:1px solid var(--green-mid);}
.cc-saldo-box.yellow{background:var(--yellow-dim);border:1px solid var(--yellow-mid);}
.cc-saldo-box.red{background:var(--red-dim);border:1px solid var(--red-mid);}
.cc-saldo-box .lbl{font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.cc-saldo-box .amt{font-family:'Syne',sans-serif;font-size:24px;font-weight:900;}
.cc-saldo-box.green .amt{color:var(--green);}
.cc-saldo-box.yellow .amt{color:var(--yellow);}
.cc-saldo-box.red .amt{color:var(--red);}
.cc-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}

/* COCHERAS PANEL en CC */
.cocheras-panel{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:16px;}
.cocheras-panel-title{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.cochera-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;}
.cochera-item.inactiva{opacity:0.5;}
.cochera-num{width:26px;height:26px;border-radius:6px;background:var(--navy2);color:#fff;font-family:'Syne',sans-serif;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cochera-num.inactiva{background:var(--muted);}
.cochera-det{flex:1;}
.cochera-det .cn-auto{font-weight:700;font-size:13px;}
.cochera-det .cn-pat{font-size:11px;color:var(--muted);}
.cochera-cuota{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--navy);flex-shrink:0;}
.cochera-estado{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.cochera-estado.activa{background:var(--green-dim);color:var(--green);}
.cochera-estado.inactiva{background:var(--red-dim);color:var(--red);}

/* TABLE */
.cc-table{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow-sm);}
.cc-thead{display:grid;grid-template-columns:90px 100px 1fr 130px 120px 110px 80px;padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--border);font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.cc-trow{display:grid;grid-template-columns:90px 100px 1fr 130px 120px 110px 80px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.1s;}
.cc-trow:last-child{border-bottom:none;}
.cc-trow:hover{background:var(--card2);}
.cc-trow .op{font-size:10px;font-weight:700;color:var(--muted);}
.cc-trow .fecha{color:var(--muted);font-size:12px;}
.cc-trow .concepto{font-weight:600;font-size:13px;}
.cc-trow .comp{color:var(--muted);font-size:11px;}
.cc-trow .modo{color:var(--muted);font-size:11px;}
.cc-trow .importe{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;text-align:right;}
.cc-trow .importe.cobro{color:var(--green);}
.cc-trow .importe.cargo{color:var(--red);}
.cc-trow .tipo-badge{text-align:center;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;}
.badge.cobro{background:var(--green-dim);color:var(--green);}
.badge.cargo{background:var(--red-dim);color:var(--red);}
.cc-empty{padding:50px;text-align:center;color:var(--muted);font-size:14px;}
.cc-foot{padding:12px 16px;background:var(--card2);border-top:2px solid var(--border);display:flex;justify-content:flex-end;align-items:center;gap:16px;}

/* CCG */
.ccg-thead{display:grid;grid-template-columns:90px 90px 140px 1fr 110px 120px 110px 80px;padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--border);font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.ccg-trow{display:grid;grid-template-columns:90px 90px 140px 1fr 110px 120px 110px 80px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.1s;}
.ccg-trow:hover{background:var(--card2);}
.ccg-sep{padding:8px 16px;background:var(--navy-dim);border-top:1.5px solid var(--navy);border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:11px;font-weight:800;color:var(--navy);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.ccg-sub{padding:8px 16px;background:var(--card2);border-top:1px solid var(--border);border-bottom:1.5px solid var(--navy);display:flex;justify-content:flex-end;gap:16px;align-items:center;font-size:12px;font-weight:700;flex-wrap:wrap;}
.ccg-total{padding:14px 16px;background:var(--navy2);display:flex;justify-content:flex-end;gap:22px;align-items:center;flex-wrap:wrap;}
.ccg-chip .cl{font-size:8px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase;text-align:center;}
.ccg-chip .cv{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fff;text-align:center;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,50,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px;backdrop-filter:blur(3px);}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);animation:modal-in 0.18s ease;max-height:92vh;overflow-y:auto;}
.modal.wide{max-width:600px;}
@keyframes modal-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-icon{font-size:26px;margin-bottom:8px;}
.modal-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--navy);margin-bottom:5px;}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5;}
.modal-actions{display:flex;gap:8px;margin-top:20px;}
.modal-actions .btn{flex:1;justify-content:center;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.field input,.field select,.field textarea{padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.18s;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);}
.field input::placeholder{color:var(--muted);}
.field textarea{resize:vertical;min-height:55px;}

/* COCHERAS EN FORM */
.cochera-form-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;}
.cochera-form-item .cochera-num-badge{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:5px;background:var(--navy2);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.cochera-form-item .remove-btn{position:absolute;top:8px;right:8px;background:var(--red-dim);color:var(--red);border:none;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;}
.cochera-form-item .remove-btn:hover{background:var(--red);color:#fff;}
.cochera-form-grid{display:grid;grid-template-columns:1fr 1fr 100px;gap:8px;margin-top:24px;}

/* CHECKLIST */
.check-item{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;}
.check-item:hover{border-color:var(--navy);}
.check-item.checked{background:var(--navy-dim);border-color:var(--navy);}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy);flex-shrink:0;cursor:pointer;}
.check-item .cn{flex:1;font-weight:700;font-size:13px;}
.check-item .ca{font-size:10px;color:var(--muted);}
.check-item .csaldo{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;}

/* WA BUBBLE */
.wa-bubble{background:#e9ffe6;border:1px solid #c3eec0;border-radius:12px 12px 4px 12px;padding:12px 14px;font-size:12px;line-height:1.75;white-space:pre-wrap;color:#111;max-height:240px;overflow-y:auto;margin:12px 0;}

/* IMPORT ZONE */
.import-zone{border:2px dashed var(--border);border-radius:13px;padding:28px;text-align:center;background:var(--card);cursor:pointer;transition:all 0.2s;margin-bottom:16px;}
.import-zone:hover{border-color:var(--navy);background:var(--navy-dim);}
.import-zone .iz-icon{font-size:34px;margin-bottom:8px;}
.import-zone .iz-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--navy);margin-bottom:3px;}
.import-zone .iz-sub{font-size:12px;color:var(--muted);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;}
.empty-state .es-icon{font-size:50px;margin-bottom:14px;opacity:0.4;}
.empty-state .es-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--navy);margin-bottom:8px;}
.empty-state .es-sub{font-size:14px;color:var(--muted);line-height:1.6;max-width:380px;margin:0 auto 22px;}

footer{border-top:1px solid var(--border);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;background:var(--surface);flex-wrap:wrap;gap:6px;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:10px 20px;border-radius:9px;font-weight:700;font-size:12px;z-index:500;box-shadow:var(--shadow-lg);white-space:nowrap;animation:toast-in 0.25s ease;}
.toast.ok{border-left:4px solid var(--green);}
.toast.err{border-left:4px solid var(--red);}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* ── LISTA DE ESPERA ── */
.espera-row{
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:13px 16px;display:flex;align-items:flex-start;gap:12px;
  margin-bottom:7px;box-shadow:var(--shadow-sm);flex-wrap:wrap;
}
.espera-num{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:var(--navy2);color:#fff;font-family:'Syne',sans-serif;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.espera-num.contactado{background:var(--yellow);}
.espera-num.ingreso{background:var(--green);}
.espera-info{flex:1;min-width:0;}
.espera-nombre{font-weight:700;font-size:14px;}
.espera-sub{color:var(--muted);font-size:11px;margin-top:3px;}
.espera-obs{font-size:12px;color:var(--text);margin-top:4px;font-style:italic;}
.espera-estado{
  padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;
  letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.espera-estado.esperando{background:var(--navy-dim);color:var(--navy);}
.espera-estado.contactado{background:var(--yellow-dim);color:var(--yellow);}
.espera-estado.ingreso{background:var(--green-dim);color:var(--green);}

/* KPI OCUPACION */
.occ-banner{
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  padding:14px 20px;display:flex;align-items:center;gap:0;
  margin-bottom:20px;box-shadow:var(--shadow-sm);overflow:hidden;
}
.occ-item{flex:1;text-align:center;padding:6px 10px;}
.occ-item+.occ-item{border-left:1px solid var(--border);}
.occ-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.occ-val{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;}
.occ-val.navy{color:var(--navy);}
.occ-val.green{color:var(--green);}
.occ-val.red{color:var(--red);}
.occ-alert{
  background:var(--red-dim);border:1px solid var(--red-mid);border-radius:11px;
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  margin-bottom:16px;font-size:13px;font-weight:700;color:var(--red);
}

  background:var(--green-dim);border:1px solid var(--green-mid);border-radius:11px;
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  margin-bottom:16px;font-size:13px;font-weight:700;color:var(--green);
}

@media(max-width:700px){
  .header{padding:0 12px;}
  main{padding:12px;}
  .cc-thead,.cc-trow{grid-template-columns:70px 1fr 95px 70px;}
  .cc-thead>*:nth-child(2),.cc-trow>*:nth-child(2),
  .cc-thead>*:nth-child(4),.cc-trow>*:nth-child(4),
  .cc-thead>*:nth-child(5),.cc-trow>*:nth-child(5),
  .cc-thead>*:nth-child(7),.cc-trow>*:nth-child(7){display:none;}
  .ccg-thead,.ccg-trow{grid-template-columns:70px 110px 1fr 90px;}
  .ccg-thead>*:nth-child(1),.ccg-trow>*:nth-child(1),
  .ccg-thead>*:nth-child(5),.ccg-trow>*:nth-child(5),
  .ccg-thead>*:nth-child(6),.ccg-trow>*:nth-child(6),
  .ccg-thead>*:nth-child(8),.ccg-trow>*:nth-child(8){display:none;}
  .form-grid,.cochera-form-grid{grid-template-columns:1fr;}
  .logo-sub{display:none;}
  .nav-btn{padding:5px 8px;font-size:11px;}
  .cochera-form-item{padding-left:12px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🚗</div>
      <div>
        <div class="logo-title">COCHERA</div>
        <div class="logo-sub">Sistema de Gestión</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" id="nav-dashboard" onclick="showView('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" id="nav-clientes" onclick="showView('clientes')">👥 Clientes</button>
      <button class="nav-btn" id="nav-ccg" onclick="showView('ccg')">📋 CC General</button>
      <button class="nav-btn" id="nav-espera" onclick="showView('espera')">⏳ Lista de Espera</button>
    </nav>
  </header>

  <div id="alert-bar" style="display:none" class="alert-bar"></div>
  <main id="main"></main>

  <footer>
    <span>🚗 Cochera · Sistema de Administración</span>
    <span id="sync-status" style="font-size:11px;color:var(--green);">☁️ Conectando con Drive...</span>
    <span id="footer-info" style="color:var(--navy);font-weight:600;"></span>
  </footer>
</div>
<div id="toast" style="display:none" class="toast ok"></div>

<script>
// ╔══════════════════════════════════════════════════════════╗
// ║  MODELO DE DATOS                                        ║
// ║  cliente = {                                            ║
// ║    id, nombre, tel, activo,                             ║
// ║    cocheras: [{id, auto, patente, cuota,                ║
// ║                saldoInicial, activa}],                  ║
// ║    movimientos: [{op, fecha, concepto, tipo,            ║
// ║                   modo, comprobante, obs, importe,      ║
// ║                   cocheraId?}]                          ║
// ║  }                                                      ║
// ╚══════════════════════════════════════════════════════════╝
let clientes  = [];
let listaEspera = []; // {id, nombre, tel, fecha, obs, estado}
let TOTAL_COCHERAS = 14;
let opCounter = 1;

// ── GOOGLE DRIVE ──
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPQN28_Vqq22tQ36CCehRmjifub-Rm8_sY8Y9GR_BuMQCqWvEVEcIIt4jKPqbgxxkEkQ/exec';
let syncStatus = 'ok'; // ok | saving | error
let syncTimer = null;
let currentView      = 'dashboard';
let currentClienteId = null;
let editingId        = null;
let toastTimer       = null;

// ── PERSISTENCIA ──
// ── GUARDAR EN GOOGLE DRIVE (con debounce de 2 segundos) ──
function save(){
  // Guardar local siempre como respaldo instantaneo
  try{
    localStorage.setItem('coch_v2_cli',JSON.stringify(clientes));
    localStorage.setItem('coch_v2_op',String(opCounter));
    localStorage.setItem('coch_v2_esp',JSON.stringify(listaEspera));
    localStorage.setItem('coch_v2_tot',String(TOTAL_COCHERAS));
  }catch(e){}
  // Guardar en Google Drive con debounce
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(saveToCloud, 2000);
}

async function saveToCloud(){
  setSyncStatus('saving');
  try{
    const payload = {
      action: 'write',
      data: { clientes, listaEspera, opCounter, TOTAL_COCHERAS }
    };
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if(json.ok){ setSyncStatus('ok'); }
    else{ setSyncStatus('error'); }
  }catch(e){ setSyncStatus('error'); }
}

async function load(){
  // Cargar local primero para mostrar algo rapido
  try{
    const c=localStorage.getItem('coch_v2_cli');
    const o=localStorage.getItem('coch_v2_op');
    const e=localStorage.getItem('coch_v2_esp');
    const t=localStorage.getItem('coch_v2_tot');
    if(c)clientes=JSON.parse(c);
    if(o)opCounter=parseInt(o)||1;
    if(e)listaEspera=JSON.parse(e);
    if(t)TOTAL_COCHERAS=parseInt(t)||14;
  }catch(e){}
  // Luego cargar desde Google Drive (fuente de verdad)
  try{
    setSyncStatus('saving');
    const res = await fetch(SCRIPT_URL + '?action=read');
    const json = await res.json();
    if(json.ok && json.data){
      const d = JSON.parse(json.data);
      if(d.clientes)   clientes      = d.clientes;
      if(d.listaEspera) listaEspera  = d.listaEspera;
      if(d.opCounter)  opCounter     = d.opCounter;
      if(d.TOTAL_COCHERAS) TOTAL_COCHERAS = d.TOTAL_COCHERAS;
      // Actualizar local con datos de Drive
      localStorage.setItem('coch_v2_cli', JSON.stringify(clientes));
      localStorage.setItem('coch_v2_op',  String(opCounter));
      localStorage.setItem('coch_v2_esp', JSON.stringify(listaEspera));
      localStorage.setItem('coch_v2_tot', String(TOTAL_COCHERAS));
    }
    setSyncStatus('ok');
  }catch(e){ setSyncStatus('error'); }
  render();
}

function setSyncStatus(status){
  syncStatus = status;
  const el = document.getElementById('sync-status');
  if(!el) return;
  if(status==='ok')     { el.textContent='☁️ Guardado en Drive'; el.style.color='var(--green)'; }
  if(status==='saving') { el.textContent='⏳ Guardando...';       el.style.color='var(--yellow)'; }
  if(status==='error')  { el.textContent='⚠️ Error al guardar';   el.style.color='var(--red)'; }
}

// ── HELPERS ──
function nextOp(){ const n=opCounter++; save(); return 'OP-'+String(n).padStart(4,'0'); }
function fmt(n){ return '$'+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:0}); }
function fmtDate(s){ if(!s)return''; const[y,m,d]=s.split('-'); return`${d}/${m}/${y}`; }
function today(){ return new Date().toISOString().split('T')[0]; }
function mesNombre(m){ return['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m-1]; }
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function uid(){ return Date.now()+Math.floor(Math.random()*9999); }

// ── SALDO Y ESTADO ──
function getSaldo(c){
  let s = c.cocheras.filter(ch=>ch.activa).reduce((a,ch)=>a+(parseFloat(ch.saldoInicial)||0),0);
  for(const m of c.movimientos) s += m.tipo==='cobro' ? parseFloat(m.importe) : -parseFloat(m.importe);
  return Math.round(s*100)/100;
}

function getCuotaTotal(c){ return c.cocheras.filter(ch=>ch.activa).reduce((a,ch)=>a+(parseFloat(ch.cuota)||0),0); }

function getEstado(c){
  const saldo=getSaldo(c);
  if(saldo>=0) return 'green';
  const cuota=getCuotaTotal(c)||1;
  const totalCargos=c.movimientos.filter(m=>m.tipo==='cargo').reduce((a,m)=>a+parseFloat(m.importe),0);
  const totalCobros=c.movimientos.filter(m=>m.tipo==='cobro').reduce((a,m)=>a+parseFloat(m.importe),0);
  const deuda=totalCargos-totalCobros;
  if(deuda/cuota>=2) return 'red';
  // fecha primer cargo impago
  let acum=totalCobros;
  const cargos=[...c.movimientos].filter(m=>m.tipo==='cargo').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let fechaImpago=null;
  for(const cargo of cargos){
    if(acum>=parseFloat(cargo.importe)){ acum-=parseFloat(cargo.importe); }
    else{ fechaImpago=cargo.fecha; break; }
  }
  if(!fechaImpago) return 'yellow';
  const dias=Math.floor((new Date()-new Date(fechaImpago))/86400000);
  return dias>15?'red':'yellow';
}
function getEstadoLabel(e){ return e==='green'?'Al día':e==='yellow'?'≤ 15 días':'2+ cuotas'; }

// ╔══════════════════════════════════════════════════════════╗
// ║  RENDER                                                 ║
// ╚══════════════════════════════════════════════════════════╝
function showView(v,cid=null){ currentView=v; currentClienteId=cid; document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); const map={dashboard:'dashboard',clientes:'clientes',cc:'dashboard',ccg:'ccg',espera:'espera'}; const nb=document.getElementById('nav-'+(map[v]||v)); if(nb)nb.classList.add('active'); render(); }

function render(){ updateAlertBar(); updateFooter(); const m=document.getElementById('main'); if(currentView==='dashboard')m.innerHTML=renderDashboard(); else if(currentView==='clientes')m.innerHTML=renderClientes(); else if(currentView==='cc')m.innerHTML=renderCC(currentClienteId); else if(currentView==='ccg')m.innerHTML=renderCCG(); else if(currentView==='espera')m.innerHTML=renderEspera(); }

function updateAlertBar(){
  const act=clientes.filter(c=>c.activo);
  const rojos=act.filter(c=>getEstado(c)==='red');
  const amarillos=act.filter(c=>getEstado(c)==='yellow');
  const bar=document.getElementById('alert-bar');
  if(!rojos.length&&!amarillos.length){bar.style.display='none';return;}
  bar.style.display='flex';
  let parts=[];
  if(rojos.length){ const tot=rojos.reduce((a,c)=>a+Math.abs(getSaldo(c)),0); parts.push(`<span style="font-weight:800;color:var(--red);">🔴 ${rojos.length} cliente${rojos.length>1?'s':''} con 2+ cuotas impagas · ${fmt(tot)}</span>`); }
  if(amarillos.length) parts.push(`<span style="font-weight:700;color:var(--yellow);">🟡 ${amarillos.length} con atraso ≤15 días</span>`);
  bar.innerHTML=`<div class="alert-pulse"></div>${parts.join('<span style="color:var(--muted);margin:0 8px;">·</span>')}`;
}

function getCocherasOcupadas(){ return clientes.filter(c=>c.activo).reduce((a,c)=>a+c.cocheras.filter(ch=>ch.activa).length,0); }
function getCocherasLibres(){ return Math.max(0, TOTAL_COCHERAS - getCocherasOcupadas()); }

function updateFooter(){
  const now=new Date();
  const libres=getCocherasLibres();
  document.getElementById('footer-info').textContent=
    `📅 ${mesNombre(now.getMonth()+1)} ${now.getFullYear()} · ${clientes.filter(c=>c.activo).length} clientes · ${getCocherasOcupadas()}/${TOTAL_COCHERAS} cocheras${libres>0?' · ⚠ '+libres+' libre'+(libres>1?'s':''):''}`;
}

// ── DASHBOARD ──
function renderDashboard(){
  const act=clientes.filter(c=>c.activo);
  if(!act.length) return renderEmpty();
  const now=new Date(); const dia=now.getDate();
  const verdes=act.filter(c=>getEstado(c)==='green').length;
  const amarillos=act.filter(c=>getEstado(c)==='yellow').length;
  const rojos=act.filter(c=>getEstado(c)==='red').length;
  const totalDeuda=act.reduce((a,c)=>{const s=getSaldo(c);return s<0?a+Math.abs(s):a;},0);
  const sigMes=mesNombre(now.getMonth()===11?1:now.getMonth()+2);
  const factMsg=dia<=2?`⚠️ Hoy es ${dia}° — <strong style="color:var(--navy)">¡Momento de facturar!</strong>`:`Próxima facturación: 1° de ${sigMes}`;
  const ocupadas=getCocherasOcupadas();
  const libres=getCocherasLibres();
  const esperando=listaEspera.filter(e=>e.estado==='esperando').length;

  return `
    <!-- KPI OCUPACIÓN -->
    <div class="occ-banner">
      <div class="occ-item"><div class="occ-lbl">Total Cocheras</div><div class="occ-val navy">${TOTAL_COCHERAS}</div></div>
      <div class="occ-item"><div class="occ-lbl">Ocupadas</div><div class="occ-val green">${ocupadas}</div></div>
      <div class="occ-item"><div class="occ-lbl">Libres</div><div class="occ-val ${libres>0?'red':'green'}">${libres}</div></div>
      <div class="occ-item"><div class="occ-lbl">En Espera</div><div class="occ-val ${esperando>0?'yellow':'navy'}">${esperando}</div></div>
    </div>

    ${libres>0?`
      <div class="occ-alert">
        🔴 <span>Tenés <strong>${libres} cochera${libres>1?'s':''} libre${libres>1?'s':''}</strong> disponible${libres>1?'s':''}${esperando>0?` · <strong>${esperando} interesado${esperando>1?'s':''}</strong> en lista de espera`:''}</span>
        ${esperando>0?`<button class="btn btn-sm btn-on" style="margin-left:auto;" onclick="showView('espera')">Ver lista →</button>`:''}
      </div>`:''}

    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon">👥</div><div class="kpi-label">Clientes Activos</div><div class="kpi-value navy">${act.length}</div></div>
      <div class="kpi-card"><div class="kpi-icon">✅</div><div class="kpi-label">Al día</div><div class="kpi-value green">${verdes}</div></div>
      <div class="kpi-card"><div class="kpi-icon">🟡</div><div class="kpi-label">Atraso leve</div><div class="kpi-value yellow">${amarillos}</div></div>
      <div class="kpi-card"><div class="kpi-icon">🔴</div><div class="kpi-label">2+ cuotas</div><div class="kpi-value red">${rojos}</div></div>
      <div class="kpi-card"><div class="kpi-icon">💰</div><div class="kpi-label">Total adeudado</div><div class="kpi-value red">${totalDeuda>0?fmt(totalDeuda):'$0'}</div></div>
    </div>
    <div class="fact-banner">
      <div><div class="t">💸 Facturación Mensual</div><div class="s">${factMsg}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="openModal('importar')">📥 Importar Excel</button>
        <button class="btn btn-navy" onclick="openModal('facturar')">💸 Facturar</button>
      </div>
    </div>
    <div class="sec-title">Estado de cuentas · ${mesNombre(now.getMonth()+1)} ${now.getFullYear()}</div>
    ${act.map(c=>{
      const saldo=getSaldo(c); const est=getEstado(c); const cochActivas=c.cocheras.filter(ch=>ch.activa);
      return `
        <div class="client-row st-${est}" onclick="showView('cc',${c.id})">
          <span class="status-pill ${est}"><div class="sp-dot"></div>${getEstadoLabel(est)}</span>
          <div class="c-info">
            <div class="c-name">${escH(c.nombre)}</div>
            <div class="cochera-tags">
              ${cochActivas.map(ch=>`<span class="cochera-tag">🚗 ${escH(ch.auto||'—')} · ${escH(ch.patente||'—')}</span>`).join('')}
              ${c.cocheras.filter(ch=>!ch.activa).map(ch=>`<span class="cochera-tag inactiva">🚫 ${escH(ch.auto||'—')}</span>`).join('')}
            </div>
          </div>
          <div class="c-saldo">
            <div class="c-saldo-num ${est}">${saldo<0?'−':'+'}${fmt(saldo)}</div>
            <div class="c-saldo-lbl">${saldo<0?'DEBE':'A FAVOR'} · ${fmt(getCuotaTotal(c))}/mes</div>
          </div>
          <div class="c-arrow">›</div>
        </div>`;
    }).join('')}`;
}

function renderEmpty(){
  return `<div class="empty-state"><div class="es-icon">🚗</div><div class="es-title">Sistema listo</div><div class="es-sub">No hay clientes cargados. Importá el Excel o agregá clientes manualmente.</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn btn-navy" onclick="openModal('importar')">📥 Importar Excel</button><button class="btn btn-ghost" onclick="showView('clientes')">+ Agregar cliente</button></div></div>`;
}

// ── CLIENTES ──
function renderClientes(){
  const act=clientes.filter(c=>c.activo);
  const baja=clientes.filter(c=>!c.activo);
  return `
    <div class="page-hdr">
      <h2>👥 Gestión de Clientes</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="openModal('importar')">📥 Importar Excel</button>
        <button class="btn btn-navy" onclick="openModal('form-cliente',null)">+ Nuevo Cliente</button>
      </div>
    </div>
    ${!act.length?`<div class="cc-empty">No hay clientes activos.</div>`:''}
    ${act.map(c=>`
      <div class="manage-row">
        <div class="manage-avatar">👤</div>
        <div class="c-info" style="flex:1;">
          <div class="c-name">${escH(c.nombre)}</div>
          <div class="c-sub">📱 ${escH(c.tel)}</div>
          <div class="cochera-tags" style="margin-top:6px;">
            ${c.cocheras.map((ch,i)=>`
              <span class="cochera-tag ${ch.activa?'':'inactiva'}" title="${ch.activa?'Activa':'Inactiva'}">
                ${ch.activa?'🚗':'🚫'} ${escH(ch.auto)} · ${escH(ch.patente)} · ${fmt(ch.cuota)}/mes
              </span>`).join('')}
          </div>
        </div>
        <div class="manage-actions">
          <button class="btn btn-sm btn-on" onclick="showView('cc',${c.id})">📋 CC</button>
          <button class="btn btn-sm btn-on" onclick="openModal('form-cliente',${c.id})">✏️ Editar</button>
          <button class="btn btn-sm btn-or" onclick="openModal('baja',${c.id})">🗑️ Baja</button>
        </div>
      </div>`).join('')}
    ${baja.length?`
      <div style="margin-top:22px;"><div class="sec-title">Dados de baja</div>
      ${baja.map(c=>`
        <div class="manage-row" style="opacity:.5;">
          <div class="manage-avatar" style="filter:grayscale(1);">🚫</div>
          <div class="c-info" style="flex:1;"><div class="c-name">${escH(c.nombre)}</div></div>
          <button class="btn btn-sm btn-og" onclick="reactivar(${c.id})">♻️ Reactivar</button>
        </div>`).join('')}</div>`:''}`;
}

// ── CC INDIVIDUAL ──
function renderCC(cid){
  const c=clientes.find(x=>x.id===cid); if(!c)return'';
  const saldo=getSaldo(c); const est=getEstado(c);
  const movs=[...c.movimientos].sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.op.localeCompare(a.op));
  return `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" onclick="showView('dashboard')">← Volver</button>
    <div class="cc-hdr">
      <div class="cc-avatar">👤</div>
      <div style="flex:1;min-width:0;">
        <div class="cc-name">${escH(c.nombre)}</div>
        <div class="cc-sub">📱 +54 9 11 ${escH(c.tel).replace(/(\d{4})(\d{4})/,'$1-$2')}</div>
        <div style="margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="status-pill ${est}"><div class="sp-dot"></div>${getEstadoLabel(est)}</span>
          <span style="font-size:11px;color:var(--muted);">Cuota total: <strong style="color:var(--navy);">${fmt(getCuotaTotal(c))}/mes</strong></span>
        </div>
      </div>
      <div class="cc-saldo-box ${est}">
        <div class="lbl">Saldo Actual</div>
        <div class="amt">${saldo<0?'−':'+'}${fmt(saldo)}</div>
      </div>
      <div class="cc-btns">
        <button class="btn btn-green btn-sm" onclick="openModal('pago',${c.id})">+ Registrar Pago</button>
        <button class="btn btn-ghost btn-sm" onclick="openModal('movimiento',${c.id})">+ Mov. manual</button>
        <button class="btn btn-wa btn-sm" onclick="openModal('wa-preview',${c.id})">📱 WhatsApp</button>

// ── CC GENERAL ──
function renderCCG(){
  const act=clientes.filter(c=>c.activo);
  if(!act.length) return `<div class="cc-empty" style="padding:60px;">Sin datos.</div>`;
  const allMovs=[];
  act.forEach(c=>c.movimientos.forEach(m=>allMovs.push({...m,clienteNombre:c.nombre})));
  allMovs.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.op.localeCompare(b.op));
  const meses={};
  allMovs.forEach(m=>{ const k=m.fecha.substring(0,7); if(!meses[k])meses[k]={movs:[],cargos:0,cobros:0}; meses[k].movs.push(m); if(m.tipo==='cargo')meses[k].cargos+=parseFloat(m.importe); else meses[k].cobros+=parseFloat(m.importe); });
  const totalFact=allMovs.filter(m=>m.tipo==='cargo').reduce((a,m)=>a+parseFloat(m.importe),0);
  const totalCob=allMovs.filter(m=>m.tipo==='cobro').reduce((a,m)=>a+parseFloat(m.importe),0);
  const totalDeuda=act.reduce((a,c)=>{const s=getSaldo(c);return s<0?a+Math.abs(s):a;},0);
  let rows='';
  Object.keys(meses).sort().forEach(key=>{
    const[y,mm]=key.split('-'); const b=meses[key]; const pend=b.cargos-b.cobros;
    rows+=`<div class="ccg-sep"><span>📅  ${mesNombre(parseInt(mm))} ${y}</span><span style="font-size:10px;font-weight:600;color:var(--muted);">Cargos: ${fmt(b.cargos)} &nbsp;·&nbsp; Cobros: ${fmt(b.cobros)} &nbsp;·&nbsp; <span style="color:${pend>0?'var(--red)':'var(--green)'};">${pend>0?'Pendiente: '+fmt(pend):'✅ Saldado'}</span></span></div>`;
    b.movs.forEach((m,i)=>{
      rows+=`<div class="ccg-trow" style="background:${i%2===0?'var(--card)':'var(--card2)'};">
        <div style="font-size:10px;font-weight:700;color:var(--muted);">${escH(m.op||'')}</div>
        <div style="color:var(--muted);font-size:12px;">${fmtDate(m.fecha)}</div>
        <div style="font-weight:700;font-size:13px;color:var(--navy);">${escH(m.clienteNombre)}</div>
        <div style="font-size:12px;color:var(--muted);">${escH(m.concepto)}</div>
        <div style="font-size:11px;color:var(--muted);">${escH(m.comprobante||'—')}</div>
        <div style="font-size:11px;color:var(--muted);">${escH(m.modo||'—')}</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;text-align:right;color:${m.tipo==='cargo'?'var(--red)':'var(--green)'};">${m.tipo==='cargo'?'−':'+'}${fmt(m.importe)}</div>
        <div style="text-align:center;"><span class="badge ${m.tipo}">${m.tipo==='cobro'?'✅ Cobro':'📋 Cargo'}</span></div>
      </div>`;
    });
    rows+=`<div class="ccg-sub"><span style="color:var(--muted);font-size:11px;">Subtotal ${mesNombre(parseInt(mm))}:</span><span style="color:var(--red);font-family:'Syne',sans-serif;">Cargos: ${fmt(b.cargos)}</span><span style="color:var(--green);font-family:'Syne',sans-serif;">Cobros: ${fmt(b.cobros)}</span><span style="color:${pend>0?'var(--red)':'var(--green)'};font-family:'Syne',sans-serif;font-weight:900;">${pend>0?'Pendiente: −'+fmt(pend):'✅ Saldado'}</span></div>`;
  });
  return `
    <div class="page-hdr"><h2>📋 Cuenta Corriente General</h2><button class="btn btn-ghost btn-sm" onclick="exportarPDFGeneral()">⬇️ Exportar PDF</button></div>
    <div class="kpi-grid" style="margin-bottom:20px;">
      <div class="kpi-card"><div class="kpi-icon">💸</div><div class="kpi-label">Total Facturado</div><div class="kpi-value navy">${fmt(totalFact)}</div></div>
      <div class="kpi-card"><div class="kpi-icon">✅</div><div class="kpi-label">Total Cobrado</div><div class="kpi-value green">${fmt(totalCob)}</div></div>
      <div class="kpi-card"><div class="kpi-icon">⚠️</div><div class="kpi-label">Deuda Global</div><div class="kpi-value red">${totalDeuda>0?fmt(totalDeuda):'$0'}</div></div>
    </div>
    <div class="cc-table">
      <div class="ccg-thead"><div>N° Op.</div><div>Fecha</div><div>Cliente</div><div>Concepto</div><div>Comprobante</div><div>Modo</div><div style="text-align:right;">Importe</div><div style="text-align:center;">Tipo</div></div>
      ${rows||`<div class="cc-empty">Sin movimientos.</div>`}
      <div class="ccg-total">
        <div class="ccg-chip"><div class="cl">Facturado</div><div class="cv">${fmt(totalFact)}</div></div>
        <div class="ccg-chip"><div class="cl">Cobrado</div><div class="cv" style="color:#80ffcc;">${fmt(totalCob)}</div></div>
        <div class="ccg-chip"><div class="cl">Deuda Global</div><div class="cv" style="color:#ff8899;">${totalDeuda>0?'−'+fmt(totalDeuda):'$0'}</div></div>
      </div>
    </div>`;
}

  }

  else if(tipo==='config-cocheras'){
    html=`<div class="modal-icon">⚙️</div>

    <div class="modal-sub">Configurá el número total de cocheras de tu garaje. Esto se usa para calcular cuántas están libres.</div>

  }

  montarModal(html,['wa-masivo','facturar','facturar-preview','form-cliente'].includes(tipo));

  const m=document.createElement('div'); m.className='modal'+(wide?' wide':''); m.innerHTML=html;

}

  msg+=`👤 *${c.nombre}*\n📱 +54 9 11 ${c.tel.replace(/(\d{4})(\d{4})/,'$1-$2')}\n📅 ${mes} ${año}\n`;
  if(cochActivas.length>1){
    msg+=`\n🚗 *COCHERAS:*\n`;

    msg+=`   *Cuota total: ${fmt(getCuotaTotal(c))}/mes*\n`;
  } else if(cochActivas.length===1){
    msg+=`🚙 ${cochActivas[0].auto} · ${cochActivas[0].patente} · ${fmt(cochActivas[0].cuota)}/mes\n`;
  }
  msg+=`━━━━━━━━━━━━━━━━━\n\n📋 *ÚLTIMOS MOVIMIENTOS*\n\n`;
  if(!movs.length){ msg+=`_Sin movimientos_\n`; }
  else { movs.forEach(m=>{ msg+=`${m.tipo==='cobro'?'✅ +':'📋 −'}${fmt(m.importe)} · ${fmtDate(m.fecha)}\n   _${m.concepto}_${m.comprobante?` (${m.comprobante})`:''}\n`; }); }
  msg+=`\n━━━━━━━━━━━━━━━━━\n`;
  if(saldo<0){ msg+=est==='yellow'?`⚠️ *Atraso leve — Saldo: −${fmt(saldo)}*\n`:`🔴 *2+ cuotas impagas — Saldo: −${fmt(saldo)}*\n`; msg+=`_Por favor regularizá tu cuenta._\n`; }

  msg+=`━━━━━━━━━━━━━━━━━\n_Cochera · Sistema de Gestión_`;

async function procesarExcel(input){
  const file=input.files[0]; if(!file)return;
  const st=document.getElementById('import-status');
  st.style.display='block'; st.style.background='var(--navy-dim)'; st.style.color='var(--navy)'; st.textContent='⏳ Procesando...';
  try{
    if(!window.XLSX){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res;s.onerror=rej; document.head.appendChild(s); }); }
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array',cellDates:true});
    const sh1=wb.Sheets[wb.SheetNames[0]];
    const rows1=XLSX.utils.sheet_to_json(sh1,{header:1,defval:''});
    const nuevos=[];
    // fila 1=titulo, fila 2=subtitulo, fila 3=cabecera, datos desde fila 4 (indice 3)
    for(let i=3;i<rows1.length;i++){
      const r=rows1[i];
      const nombre=String(r[0]||'').trim();
      if(!nombre || nombre.startsWith('⚠')) continue;
      const tel=String(r[1]||'').replace(/\D/g,'');
      const cocheras=[];
      // hasta 3 cocheras: cols 2-5, 6-9, 10-13
      for(let c=0;c<3;c++){
        const base=2+c*4;
        const cuota=parseFloat(r[base+2])||0;
        if(!cuota) break; // si no hay cuota no hay cochera
        cocheras.push({id:uid(),auto:String(r[base]||'').trim(),patente:String(r[base+1]||'').trim(),cuota,saldoInicial:parseFloat(r[base+3])||0,activa:true});
      }
      // si no tiene cocheras en columnas especificas, crear una vacia
      if(!cocheras.length) cocheras.push({id:uid(),auto:'',patente:'',cuota:0,saldoInicial:0,activa:true});
      nuevos.push({id:uid(),nombre,tel,activo:true,cocheras,movimientos:[]});
    }
    // HOJA 2: movimientos
    const movsPorNombre={};
    if(wb.SheetNames.length>1){
      const sh2=wb.Sheets[wb.SheetNames[1]];
      const rows2=XLSX.utils.sheet_to_json(sh2,{header:1,defval:''});
      // fila 1=titulo, fila 2=subtitulo, fila 3=cabecera, datos desde fila 4 (indice 3)
      for(let i=3;i<rows2.length;i++){
        const r=rows2[i];
        let fechaRaw=r[0]; let fecha='';
        if(fechaRaw instanceof Date){ fecha=fechaRaw.toISOString().split('T')[0]; }
        else{ const s=String(fechaRaw||'').trim(); if(s.includes('/')){ const p=s.split('/'); fecha=`${p[2].length===4?p[2]:'20'+p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; }else{fecha=s;} }
        if(!fecha)continue;
        const nom=String(r[1]||'').trim(); if(!nom)continue;
        const concepto=String(r[2]||'').trim();
        const tipo=String(r[3]||'').toLowerCase().includes('cobro')?'cobro':'cargo';
        const modo=String(r[4]||'').trim()||'—';
        const comprobante=String(r[5]||'').trim();
        const importe=parseFloat(r[6])||0; if(!importe)continue;
        if(!movsPorNombre[nom])movsPorNombre[nom]=[];
        movsPorNombre[nom].push({op:'',fecha,concepto,modo,comprobante,obs:'',importe,tipo});
      }
    }
    nuevos.forEach(c=>{
      const movs=movsPorNombre[c.nombre]||[];
      movs.sort((a,b)=>a.fecha.localeCompare(b.fecha));
      movs.forEach(m=>{m.op=nextOp();});
      c.movimientos=movs;
    });
    clientes=nuevos; save();
    st.style.background='var(--green-dim)'; st.style.color='var(--green)';
    st.textContent=`✅ Importado: ${nuevos.length} clientes · ${Object.values(movsPorNombre).flat().length} movimientos`;
    setTimeout(()=>{closeModal();render();},1500);
  }catch(err){
    st.style.background='var(--red-dim)'; st.style.color='var(--red)';
    st.textContent=`❌ Error: ${err.message}`;
  }
}

async function cargarJsPDF(){

}

  const allMovs=[];
  act.forEach(c=>c.movimientos.forEach(m=>allMovs.push({...m,clienteNombre:c.nombre})));
  allMovs.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const meses={};
  allMovs.forEach(m=>{const k=m.fecha.substring(0,7);if(!meses[k])meses[k]=[];meses[k].push(m);});
  const totalFact=allMovs.filter(m=>m.tipo==='cargo').reduce((a,m)=>a+m.importe,0);
  const totalCob=allMovs.filter(m=>m.tipo==='cobro').reduce((a,m)=>a+m.importe,0);
  const totalDeuda=act.reduce((a,c)=>{const s=getSaldo(c);return s<0?a+Math.abs(s):a;},0);

  doc.setFillColor(...navy);doc.roundedRect(10,10,190,18,3,3,'F');
  doc.setTextColor(...white);doc.setFontSize(13);doc.setFont('helvetica','bold');doc.text('COCHERA',14,21);
  doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(180,190,210);doc.text('SISTEMA DE GESTIÓN',14,26);
  doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...white);doc.text('CUENTA CORRIENTE GENERAL',200,19,{align:'right'});
  doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(180,190,210);doc.text('TODOS LOS CLIENTES · CONSOLIDADO',200,25,{align:'right'});

  doc.setFillColor(...lightGray);doc.roundedRect(10,32,190,12,2,2,'F');
  doc.setTextColor(...gray);doc.setFontSize(6);doc.setFont('helvetica','bold');
  doc.text('TOTAL FACTURADO',40,37,{align:'center'});doc.text('TOTAL COBRADO',105,37,{align:'center'});doc.text('DEUDA GLOBAL',170,37,{align:'center'});
  doc.setFontSize(11);doc.setFont('helvetica','bold');
  doc.setTextColor(...navy);doc.text(fmt(totalFact),40,43,{align:'center'});
  doc.setTextColor(...green);doc.text(fmt(totalCob),105,43,{align:'center'});
  doc.setTextColor(...red);doc.text(totalDeuda>0?'−'+fmt(totalDeuda):'$0',170,43,{align:'center'});

  const bodyRows=[];
  Object.keys(meses).sort().forEach(key=>{
    const[y,mm]=key.split('-');
    bodyRows.push([{content:`📅  ${mesNombre(parseInt(mm))} ${y}`,colSpan:7,styles:{fillColor:navyL,textColor:navy,fontStyle:'bold',fontSize:8}}]);
    meses[key].forEach((m,i)=>{bodyRows.push([m.op||'',fmtDate(m.fecha),m.clienteNombre,m.concepto,m.comprobante||'—',m.modo||'—',`${m.tipo==='cargo'?'−':'+'}${fmt(m.importe)}`]);});
    const cg=meses[key].filter(m=>m.tipo==='cargo').reduce((a,m)=>a+m.importe,0);
    const cb=meses[key].filter(m=>m.tipo==='cobro').reduce((a,m)=>a+m.importe,0);
    const pd=cg-cb;
    bodyRows.push([{content:`Subtotal ${mesNombre(parseInt(mm))}: Cargos ${fmt(cg)} · Cobros ${fmt(cb)} · ${pd>0?'Pendiente: −'+fmt(pd):'✅ Saldado'}`,colSpan:7,styles:{fillColor:navyL,textColor:pd>0?red:green,fontStyle:'bold',fontSize:7,halign:'right'}}]);
  });

  doc.autoTable({startY:48,
    head:[['N° Op.','Fecha','Cliente','Concepto','Comprobante','Modo','Importe']],
    body:bodyRows,
    foot:[[{content:`TOTAL — Facturado: ${fmt(totalFact)} · Cobrado: ${fmt(totalCob)} · Deuda: ${totalDeuda>0?'−'+fmt(totalDeuda):'$0'}`,colSpan:7,styles:{fillColor:navy,textColor:white,fontStyle:'bold',fontSize:8,halign:'right'}}]],
    styles:{fontSize:7,cellPadding:2.5},headStyles:{fillColor:navy,textColor:white,fontStyle:'bold',fontSize:6},
    columnStyles:{0:{cellWidth:16,textColor:gray},1:{cellWidth:18},2:{cellWidth:32,fontStyle:'bold',textColor:navy},3:{cellWidth:46},4:{cellWidth:22,halign:'center'},5:{cellWidth:22,halign:'center'},6:{cellWidth:20,halign:'right'}},
    alternateRowStyles:{fillColor:lightGray},showFoot:'lastPage',margin:{left:10,right:10},
  });
  const py=doc.lastAutoTable.finalY+6;
  doc.setDrawColor(221,228,240);doc.line(10,py,200,py);
  doc.setFontSize(7);doc.setTextColor(...gray);doc.text('Cochera · Sistema de Gestión',10,py+5);
  doc.text(`Emitido: ${now.toLocaleDateString('es-AR')} | Generado automáticamente`,200,py+5,{align:'right'});
  doc.save(`CC_General_${mesNombre(now.getMonth()+1)}${now.getFullYear()}.pdf`);
  showToast('✅ PDF General descargado');
}

// ── LISTA DE ESPERA ──
function renderEspera(){
  const libres=getCocherasLibres();
  const esperando=listaEspera.filter(e=>e.estado==='esperando');
  const otros=listaEspera.filter(e=>e.estado!=='esperando');

  return `
    <div class="page-hdr">
      <h2>⏳ Lista de Espera</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="openModal('config-cocheras')">⚙️ Total cocheras: ${TOTAL_COCHERAS}</button>
        <button class="btn btn-navy" onclick="openModal('form-espera',null)">+ Agregar interesado</button>
      </div>
    </div>

    ${libres>0?`
      <div class="occ-alert" style="margin-bottom:16px;">
        🔴 <strong>${libres} cochera${libres>1?'s':''} libre${libres>1?'s':''} disponible${libres>1?'s':''}</strong> — hay ${esperando.length} interesado${esperando.length!==1?'s':''} en espera.
      </div>`:`
      <div class="occ-free" style="margin-bottom:16px;">
        ✅ <strong>Cocheras completas</strong> — ${TOTAL_COCHERAS}/${TOTAL_COCHERAS} ocupadas. Hay ${esperando.length} interesado${esperando.length!==1?'s':''} para cuando haya lugar.
      </div>`}

    ${!listaEspera.length?`
      <div class="cc-empty" style="padding:50px;">
        No hay nadie en la lista de espera todavía.<br>
        <button class="btn btn-navy" style="margin-top:16px;" onclick="openModal('form-espera',null)">+ Agregar interesado</button>
      </div>`:''}

    ${esperando.length?`<div class="sec-title">En espera · ${esperando.length} interesado${esperando.length>1?'s':''}</div>`:''}
    ${esperando.map((e,i)=>`
      <div class="espera-row">
        <div class="espera-num">${i+1}</div>
        <div class="espera-info">
          <div class="espera-nombre">${escH(e.nombre)}</div>
          <div class="espera-sub">📱 ${escH(e.tel)} &nbsp;·&nbsp; 📅 Desde: ${fmtDate(e.fecha)}</div>
          ${e.obs?`<div class="espera-obs">💬 ${escH(e.obs)}</div>`:''}
        </div>
        <span class="espera-estado esperando">⏳ Esperando</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;">
          <button class="btn btn-sm btn-oy" onclick="cambiarEstadoEspera(${e.id},'contactado')">📞 Contactado</button>
          <button class="btn btn-sm btn-og" onclick="cambiarEstadoEspera(${e.id},'ingreso')">✅ Ingresó</button>
          <button class="btn btn-sm btn-on" onclick="openModal('form-espera',${e.id})">✏️</button>
          <button class="btn btn-sm btn-or" onclick="eliminarEspera(${e.id})">🗑️</button>
        </div>
      </div>`).join('')}

    ${otros.length?`
      <div class="sec-title" style="margin-top:20px;">Historial</div>
      ${otros.map(e=>`
        <div class="espera-row" style="opacity:.6;">
          <div class="espera-num ${e.estado}">${e.estado==='ingreso'?'✅':'📞'}</div>
          <div class="espera-info">
            <div class="espera-nombre">${escH(e.nombre)}</div>
            <div class="espera-sub">📱 ${escH(e.tel)} &nbsp;·&nbsp; 📅 Desde: ${fmtDate(e.fecha)}</div>
            ${e.obs?`<div class="espera-obs">💬 ${escH(e.obs)}</div>`:''}
          </div>
          <span class="espera-estado ${e.estado}">${e.estado==='ingreso'?'✅ Ingresó':'📞 Contactado'}</span>
          <button class="btn btn-sm btn-ghost" onclick="cambiarEstadoEspera(${e.id},'esperando')">↩ Volver a espera</button>
        </div>`).join('')}`:''}`;
}

// ── ACCIONES ESPERA ──
function cambiarEstadoEspera(id, estado){
  const e=listaEspera.find(x=>x.id===id);
  if(e){ e.estado=estado; save(); showToast(`✅ Estado actualizado`); render(); }
}
function eliminarEspera(id){
  if(!confirm('¿Eliminar este interesado de la lista?')) return;
  listaEspera=listaEspera.filter(x=>x.id!==id);
  save(); showToast('✅ Eliminado'); render();
}
function guardarEspera(){
  const nombre=(document.getElementById('e-nombre').value||'').trim();
  const tel=(document.getElementById('e-tel').value||'').replace(/\D/g,'');
  const fecha=document.getElementById('e-fecha').value;
  const obs=(document.getElementById('e-obs').value||'').trim();
  if(!nombre){showToast('El nombre es obligatorio',false);return;}
  const editId=parseInt(document.getElementById('e-id').value)||0;
  if(editId){
    const e=listaEspera.find(x=>x.id===editId);
    Object.assign(e,{nombre,tel,fecha,obs});
    showToast('✅ Actualizado');
  } else {
    listaEspera.push({id:uid(),nombre,tel,fecha:fecha||today(),obs,estado:'esperando'});
    showToast('✅ Interesado agregado');
  }
  save(); closeModal(); render();
}
function guardarTotalCocheras(){
  const t=parseInt(document.getElementById('tc-total').value)||14;
  TOTAL_COCHERAS=t; save(); closeModal();
  showToast(`✅ Total cocheras: ${t}`); render();
}

// ── TOAST ──
function showToast(msg,ok=true){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast '+(ok?'ok':'err'); t.style.display='block'; if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.display='none';},3200); }

// ── AVISO FACTURACIÓN ──
function checkFacturacion(){ if(!clientes.filter(c=>c.activo).length)return; const dia=new Date().getDate(); if(dia===1||dia===2){ const mes=mesNombre(new Date().getMonth()+1); setTimeout(()=>{ if(confirm(`🚗 COCHERA · Recordatorio\n\nHoy es ${dia}° de ${mes}.\n¿Querés facturar la mensualidad ahora?`))openModal('facturar'); },800); } }

// ── INICIO ──
// load() es async — muestra pantalla de carga y luego renderiza
document.getElementById('main').innerHTML = '<div class="empty-state"><div class="es-icon">☁️</div><div class="es-title">Conectando con Google Drive...</div><div class="es-sub">Cargando tus datos, un momento.</div></div>';
load().then(() => { render(); checkFacturacion(); });
</script>
