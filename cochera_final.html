<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cochera · Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background:#161616;color:#e0d8d0;-webkit-font-smoothing:antialiased;}

/* ── VARIABLES ── */
:root{
  --bg:#161616;
  --card:#222;
  --card2:#2a2a2a;
  --border:#2a2a2a;
  --copper:#c9956c;
  --copper-dim:rgba(201,149,108,0.12);
  --copper-mid:rgba(201,149,108,0.25);
  --green:#34d399;
  --green-dim:rgba(52,211,153,0.12);
  --green-mid:rgba(52,211,153,0.25);
  --yellow:#fbbf24;
  --yellow-dim:rgba(251,191,36,0.12);
  --yellow-mid:rgba(251,191,36,0.25);
  --red:#f87171;
  --red-dim:rgba(248,113,113,0.10);
  --red-mid:rgba(248,113,113,0.22);
  --text:#e0d8d0;
  --muted:#555;
  --shadow:0 4px 20px rgba(0,0,0,0.4);
  --sidebar:240px;
}

/* ══════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════ */
.sidebar{
  position:fixed;
  top:0;left:0;bottom:0;
  width:var(--sidebar);
  background:#0a0a0a;
  border-right:1px solid #1a1a1a;
  display:flex;
  flex-direction:column;
  z-index:100;
  overflow:hidden;
}

.sb-logo{
  padding:28px 22px 22px;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.sb-icon{
  width:46px;height:46px;
  background:var(--copper);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:#111;
  margin-bottom:14px;
}
.sb-title{
  font-family:'Syne',sans-serif;
  font-size:22px;font-weight:800;
  color:#fff;letter-spacing:2px;
  display:block;line-height:1;margin-bottom:10px;
}
.sb-sub{
  font-size:9px;color:#3a3a3a;
  letter-spacing:1px;text-transform:uppercase;
  line-height:1.9;display:block;
}

.sb-nav{
  padding:16px 14px;
  display:flex;flex-direction:column;
  gap:3px;flex:1;
}
.nb{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border-radius:8px;border:none;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-weight:600;font-size:13px;
  background:transparent;color:#444;
  text-align:left;width:100%;
  transition:all 0.15s;
  border-left:3px solid transparent;
}
.nb:hover{background:#111;color:#888;}
.nb.active{
  background:#1a1a1a;
  color:var(--copper);
  border-left:3px solid var(--copper);
}

.sb-foot{
  padding:14px 18px;
  border-top:1px solid #1a1a1a;
  flex-shrink:0;
}
#sync-status{font-size:10px;color:var(--green);margin-bottom:3px;}
#footer-info{font-size:9px;color:#333;line-height:1.7;}

/* ══════════════════════════════════════════
   MAIN
══════════════════════════════════════════ */
.main-wrap{
  margin-left:var(--sidebar);
  min-height:100vh;
  display:flex;flex-direction:column;
}

.alert-bar{
  background:rgba(248,113,113,0.06);
  border-bottom:1.5px solid rgba(248,113,113,0.2);
  padding:8px 24px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.alert-pulse{
  width:8px;height:8px;border-radius:50%;
  background:var(--red);flex-shrink:0;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.5);}60%{box-shadow:0 0 0 6px rgba(248,113,113,0);}}

main{flex:1;padding:28px;}

/* ══════════════════════════════════════════
   KPI GRID
══════════════════════════════════════════ */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:20px;
}
.kpi-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:18px 16px;
  transition:transform 0.2s;
}
.kpi-card:hover{transform:translateY(-2px);}
.kpi-icon{font-size:20px;margin-bottom:8px;}
.kpi-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}
.kpi-val{
  font-family:'Syne',sans-serif;font-size:26px;font-weight:800;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.kv-copper{color:var(--copper);}
.kv-green{color:var(--green);}
.kv-yellow{color:var(--yellow);}
.kv-red{color:var(--red);}

/* ══════════════════════════════════════════
   OCCUPATION BANNER
══════════════════════════════════════════ */
.occ-banner{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:14px 20px;
  display:flex;align-items:center;gap:0;
  margin-bottom:20px;
}
.occ-item{flex:1;text-align:center;padding:4px 8px;}
.occ-item+.occ-item{border-left:1px solid var(--border);}
.occ-lbl{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
.occ-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;}

/* ══════════════════════════════════════════
   BANNERS
══════════════════════════════════════════ */
.fact-banner{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:16px 22px;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;margin-bottom:20px;flex-wrap:wrap;
}
.fact-banner .t{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--copper);}
.fact-banner .s{color:var(--muted);font-size:12px;margin-top:3px;}

.libre-alert{
  background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.2);
  border-radius:10px;padding:10px 16px;
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;font-size:13px;font-weight:700;color:var(--red);
}

/* ══════════════════════════════════════════
   SEC TITLE
══════════════════════════════════════════ */
.sec-title{
  font-size:9px;font-weight:700;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ══════════════════════════════════════════
   CLIENT ROWS
══════════════════════════════════════════ */
.client-row{
  background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:7px;cursor:pointer;
  transition:all 0.15s;border-left:3px solid transparent;
}
.client-row:hover{background:var(--card2);border-color:var(--copper);}
.client-row.st-green{border-left:3px solid var(--green);}
.client-row.st-yellow{border-left:3px solid var(--yellow);}
.client-row.st-red{border-left:3px solid var(--red);}

.sp{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:20px;
  font-size:9px;font-weight:700;letter-spacing:0.5px;
  text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.sp.green{background:var(--green-dim);color:var(--green);}
.sp.yellow{background:var(--yellow-dim);color:var(--yellow);}
.sp.red{background:var(--red-dim);color:var(--red);}
.sp-dot{width:5px;height:5px;border-radius:50%;}
.sp.green .sp-dot{background:var(--green);}
.sp.yellow .sp-dot{background:var(--yellow);animation:by 1.4s ease-in-out infinite;}
.sp.red .sp-dot{background:var(--red);animation:br 1s ease-in-out infinite;}
@keyframes by{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes br{0%,100%{opacity:1;}50%{opacity:0.15;}}

.c-info{flex:1;min-width:0;}
.c-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-sub{color:var(--muted);font-size:11px;margin-top:2px;}
.c-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.c-tag{
  background:var(--copper-dim);color:var(--copper);
  border:1px solid var(--copper-mid);
  border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;
}
.c-tag.inactiva{background:var(--red-dim);color:var(--red);border-color:var(--red-mid);opacity:0.6;}
.c-saldo{text-align:right;flex-shrink:0;}
.c-saldo-num{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;}
.c-saldo-num.green{color:var(--green);}
.c-saldo-num.yellow{color:var(--yellow);}
.c-saldo-num.red{color:var(--red);}
.c-saldo-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.c-arrow{color:var(--muted);font-size:16px;flex-shrink:0;}

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn{
  padding:9px 18px;border-radius:8px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;
  transition:all 0.18s;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.btn-copper{background:var(--copper);color:#111;}
.btn-copper:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-green{background:var(--green);color:#111;}
.btn-green:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-wa{background:#25D366;color:#fff;}
.btn-wa:hover{background:#1db954;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--copper);color:var(--copper);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px;}
.btn-or{background:var(--red-dim);color:var(--red);border:1px solid var(--red-mid);}
.btn-on{background:var(--copper-dim);color:var(--copper);border:1px solid var(--copper-mid);}
.btn-og{background:var(--green-dim);color:var(--green);border:1px solid var(--green-mid);}
.btn-oy{background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow-mid);}

/* ══════════════════════════════════════════
   MANAGE ROWS
══════════════════════════════════════════ */
.manage-row{
  background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:13px 16px;
  display:flex;align-items:flex-start;gap:12px;
  margin-bottom:7px;flex-wrap:wrap;
}
.manage-avatar{
  width:40px;height:40px;border-radius:9px;flex-shrink:0;
  background:var(--copper-dim);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.manage-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-hdr h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--copper);}

/* ══════════════════════════════════════════
   CC HEADER
══════════════════════════════════════════ */
.cc-hdr{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:18px 22px;
  display:flex;align-items:flex-start;gap:14px;
  margin-bottom:16px;flex-wrap:wrap;
}
.cc-avatar{
  width:50px;height:50px;border-radius:11px;flex-shrink:0;
  background:var(--copper);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.cc-name{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--copper);}
.cc-sub{color:var(--muted);font-size:12px;margin-top:3px;}
.cc-saldo-box{
  text-align:center;padding:12px 18px;border-radius:10px;flex-shrink:0;min-width:140px;
}
.cc-saldo-box.green{background:var(--green-dim);border:1px solid var(--green-mid);}
.cc-saldo-box.yellow{background:var(--yellow-dim);border:1px solid var(--yellow-mid);}
.cc-saldo-box.red{background:var(--red-dim);border:1px solid var(--red-mid);}
.cc-saldo-box .lbl{font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.cc-saldo-box .amt{font-family:'Syne',sans-serif;font-size:24px;font-weight:900;}
.cc-saldo-box.green .amt{color:var(--green);}
.cc-saldo-box.yellow .amt{color:var(--yellow);}
.cc-saldo-box.red .amt{color:var(--red);}
.cc-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}

/* ══════════════════════════════════════════
   COCHERAS PANEL
══════════════════════════════════════════ */
.cocheras-panel{
  background:var(--card2);border:1px solid var(--border);
  border-radius:11px;padding:14px 16px;margin-bottom:16px;
}
.cocheras-panel-title{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.cochera-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;background:var(--card);
  border:1px solid var(--border);border-radius:9px;margin-bottom:6px;
}
.cochera-item.inactiva{opacity:0.5;}
.cochera-num{
  width:26px;height:26px;border-radius:6px;
  background:var(--copper);color:#111;
  font-family:'Syne',sans-serif;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cochera-num.inactiva{background:var(--muted);}
.cochera-det{flex:1;}
.cochera-det .cn-auto{font-weight:700;font-size:13px;}
.cochera-det .cn-pat{font-size:11px;color:var(--muted);}
.cochera-cuota{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--copper);flex-shrink:0;}
.cochera-estado{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.cochera-estado.activa{background:var(--green-dim);color:var(--green);}
.cochera-estado.inactiva{background:var(--red-dim);color:var(--red);}

/* ══════════════════════════════════════════
   TABLA CC
══════════════════════════════════════════ */
.cc-table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.cc-thead{
  display:grid;grid-template-columns:90px 100px 1fr 130px 120px 110px 80px;
  padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--border);
  font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;
}
.cc-trow{
  display:grid;grid-template-columns:90px 100px 1fr 130px 120px 110px 80px;
  padding:11px 16px;border-bottom:1px solid var(--border);
  align-items:center;transition:background 0.1s;
}
.cc-trow:last-child{border-bottom:none;}
.cc-trow:hover{background:var(--card2);}
.cc-trow .op{font-size:10px;font-weight:700;color:var(--muted);}
.cc-trow .fecha{color:var(--muted);font-size:12px;}
.cc-trow .concepto{font-weight:600;font-size:13px;}
.cc-trow .comp{color:var(--muted);font-size:11px;}
.cc-trow .modo{color:var(--muted);font-size:11px;}
.cc-trow .importe{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;text-align:right;}
.cc-trow .importe.cobro{color:var(--green);}
.cc-trow .importe.cargo{color:var(--red);}
.cc-trow .tipo-badge{text-align:center;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;}
.badge.cobro{background:var(--green-dim);color:var(--green);}
.badge.cargo{background:var(--red-dim);color:var(--red);}
.cc-empty{padding:50px;text-align:center;color:var(--muted);font-size:14px;}
.cc-foot{
  padding:12px 16px;background:var(--card2);border-top:2px solid var(--border);
  display:flex;justify-content:flex-end;align-items:center;gap:16px;
}

/* ══════════════════════════════════════════
   CCG
══════════════════════════════════════════ */
.ccg-thead{display:grid;grid-template-columns:90px 90px 140px 1fr 110px 120px 110px 80px;padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--border);font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.ccg-trow{display:grid;grid-template-columns:90px 90px 140px 1fr 110px 120px 110px 80px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.1s;}
.ccg-trow:hover{background:var(--card2);}
.ccg-sep{padding:8px 16px;background:var(--copper-dim);border-top:1.5px solid var(--copper);border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:11px;font-weight:800;color:var(--copper);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.ccg-sub{padding:8px 16px;background:var(--card2);border-top:1px solid var(--border);border-bottom:1.5px solid var(--copper);display:flex;justify-content:flex-end;gap:16px;align-items:center;font-size:12px;font-weight:700;flex-wrap:wrap;}
.ccg-total{padding:14px 16px;background:#0a0a0a;display:flex;justify-content:flex-end;gap:22px;align-items:center;flex-wrap:wrap;}
.ccg-chip .cl{font-size:8px;color:#444;letter-spacing:1px;text-transform:uppercase;text-align:center;}
.ccg-chip .cv{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#e0d8d0;text-align:center;}

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:14px;backdrop-filter:blur(4px);
}
.modal{
  background:#1a1a1a;border:1px solid #2a2a2a;
  border-radius:16px;padding:28px;width:100%;max-width:460px;
  box-shadow:0 24px 80px rgba(0,0,0,0.7);
  animation:min 0.18s ease;max-height:92vh;overflow-y:auto;
}
.modal.wide{max-width:580px;}
@keyframes min{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-icon{font-size:26px;margin-bottom:8px;}
.modal-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--copper);margin-bottom:5px;}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5;}
.modal-actions{display:flex;gap:8px;margin-top:20px;}
.modal-actions .btn{flex:1;justify-content:center;}

/* ══════════════════════════════════════════
   FORM
══════════════════════════════════════════ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.field input,.field select,.field textarea{
  padding:9px 12px;background:#111;border:1px solid #2a2a2a;
  border-radius:8px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;transition:border-color 0.18s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--copper);}
.field input::placeholder{color:var(--muted);}
.field select option{background:#1a1a1a;}
.field textarea{resize:vertical;min-height:55px;}

/* ══════════════════════════════════════════
   CHECKLIST
══════════════════════════════════════════ */
.check-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 13px;background:#111;border:1px solid #2a2a2a;
  border-radius:9px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;
}
.check-item:hover{border-color:var(--copper);}
.check-item.checked{background:var(--copper-dim);border-color:var(--copper);}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--copper);flex-shrink:0;cursor:pointer;}
.check-item .cn{flex:1;font-weight:700;font-size:13px;}
.check-item .ca{font-size:10px;color:var(--muted);}
.check-item .csaldo{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;}

/* ══════════════════════════════════════════
   COCHERA FORM
══════════════════════════════════════════ */
.cochera-form-item{background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:8px;position:relative;}
.cochera-form-item .cnum{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:5px;background:var(--copper);color:#111;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.cochera-form-item .remove-btn{position:absolute;top:8px;right:8px;background:var(--red-dim);color:var(--red);border:none;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;}
.cochera-form-item .remove-btn:hover{background:var(--red);color:#fff;}
.cochera-form-grid{display:grid;grid-template-columns:1fr 1fr 100px;gap:8px;margin-top:26px;}

/* ══════════════════════════════════════════
   ESPERA
══════════════════════════════════════════ */
.espera-row{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:7px;flex-wrap:wrap;}
.espera-num{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:var(--copper);color:#111;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.espera-num.contactado{background:var(--yellow);}
.espera-num.ingreso{background:var(--green);}
.espera-info{flex:1;min-width:0;}
.espera-nombre{font-weight:700;font-size:14px;}
.espera-sub{color:var(--muted);font-size:11px;margin-top:3px;}
.espera-obs{font-size:12px;color:var(--text);margin-top:4px;font-style:italic;}
.espera-estado{padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.espera-estado.esperando{background:var(--copper-dim);color:var(--copper);}
.espera-estado.contactado{background:var(--yellow-dim);color:var(--yellow);}
.espera-estado.ingreso{background:var(--green-dim);color:var(--green);}

/* ══════════════════════════════════════════
   WA BUBBLE
══════════════════════════════════════════ */
.wa-bubble{background:#0d1f0d;border:1px solid #1a3a1a;border-radius:12px 12px 4px 12px;padding:12px 14px;font-size:12px;line-height:1.75;white-space:pre-wrap;color:#c8f0c8;max-height:240px;overflow-y:auto;margin:12px 0;}

/* ══════════════════════════════════════════
   IMPORT ZONE
══════════════════════════════════════════ */
.import-zone{border:2px dashed #2a2a2a;border-radius:12px;padding:28px;text-align:center;background:var(--card);cursor:pointer;transition:all 0.2s;margin-bottom:16px;}
.import-zone:hover{border-color:var(--copper);background:var(--copper-dim);}
.import-zone .iz-icon{font-size:34px;margin-bottom:8px;}
.import-zone .iz-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--copper);margin-bottom:3px;}
.import-zone .iz-sub{font-size:12px;color:var(--muted);}

/* ══════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════ */
.empty-state{text-align:center;padding:60px 20px;}
.empty-state .es-icon{font-size:50px;margin-bottom:14px;opacity:0.3;}
.empty-state .es-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--copper);margin-bottom:8px;}
.empty-state .es-sub{font-size:14px;color:var(--muted);line-height:1.6;max-width:380px;margin:0 auto 22px;}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#1a1a1a;color:var(--text);
  padding:10px 20px;border-radius:9px;font-weight:700;font-size:12px;
  z-index:500;box-shadow:var(--shadow);white-space:nowrap;
  animation:toast-in 0.25s ease;
}
.toast.ok{border-left:4px solid var(--green);}
.toast.err{border-left:4px solid var(--red);}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* ══════════════════════════════════════════
   RESPONSIVE MOBILE
══════════════════════════════════════════ */
@media(max-width:700px){
  .sidebar{
    width:100%;height:auto;
    position:fixed;bottom:0;top:auto;left:0;right:0;
    flex-direction:row;
    border-right:none;border-top:1px solid #1a1a1a;
    z-index:200;
  }
  .sb-logo{display:none;}
  .sb-nav{
    flex-direction:row;padding:6px 8px;gap:2px;
    overflow-x:auto;justify-content:space-around;flex:1;
  }
  .sb-foot{display:none;}
  .nb{
    flex-direction:column;gap:2px;font-size:9px;
    padding:8px 10px;
    border-left:none!important;
    border-bottom:2px solid transparent;
    border-radius:6px;min-width:60px;
    justify-content:center;align-items:center;
  }
  .nb.active{
    border-left:none!important;
    border-bottom:2px solid var(--copper);
    background:#111;
  }
  .main-wrap{margin-left:0;padding-bottom:72px;}
  main{padding:12px;}
  .cc-thead,.cc-trow{grid-template-columns:70px 1fr 90px 70px;}
  .cc-thead>*:nth-child(2),.cc-trow>*:nth-child(2),
  .cc-thead>*:nth-child(4),.cc-trow>*:nth-child(4),
  .cc-thead>*:nth-child(5),.cc-trow>*:nth-child(5),
  .cc-thead>*:nth-child(7),.cc-trow>*:nth-child(7){display:none;}
  .ccg-thead,.ccg-trow{grid-template-columns:70px 110px 1fr 90px;}
  .ccg-thead>*:nth-child(1),.ccg-trow>*:nth-child(1),
  .ccg-thead>*:nth-child(5),.ccg-trow>*:nth-child(5),
  .ccg-thead>*:nth-child(6),.ccg-trow>*:nth-child(6),
  .ccg-thead>*:nth-child(8),.ccg-trow>*:nth-child(8){display:none;}
  .form-grid,.cochera-form-grid{grid-template-columns:1fr;}
  .cc-btns .btn-ghost{display:none;}
  .occ-val{font-size:18px;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-icon">🅿</div>
    <span class="sb-title">COCHERA</span>
    <span class="sb-sub">R. Sáenz Peña · Baradero<br>14 espacios</span>
  </div>
  <nav class="sb-nav">
    <button class="nb active" id="nav-dashboard" onclick="showView('dashboard')">📊 Dashboard</button>
    <button class="nb" id="nav-clientes" onclick="showView('clientes')">👥 Clientes</button>
    <button class="nb" id="nav-ccg" onclick="showView('ccg')">📋 CC General</button>
    <button class="nb" id="nav-espera" onclick="showView('espera')">⏳ Lista de Espera</button>
  </nav>
  <div class="sb-foot">
    <div id="sync-status">☁️ Conectando...</div>
    <div id="footer-info"></div>
  </div>
</aside>

<!-- MAIN -->
<div class="main-wrap">
  <div id="alert-bar" style="display:none" class="alert-bar"></div>
  <main id="main"></main>
</div>

<div id="toast" style="display:none" class="toast ok"></div>

<script>
// ══════════════════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════════════════
let clientes     = [];
let listaEspera  = [];
let TOTAL_COCHERAS = 14;
let opCounter    = 1;
let currentView  = 'dashboard';
let currentClienteId = null;
let editingId    = null;
let toastTimer   = null;
let tempCocheras = [];
let syncTimer    = null;

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPQN28_Vqq22tQ36CCehRmjifub-Rm8_sY8Y9GR_BuMQCqWvEVEcIIt4jKPqbgxxkEkQ/exec';

// ── PERSISTENCIA ──
function save(){
  try{
    localStorage.setItem('coch_cli', JSON.stringify(clientes));
    localStorage.setItem('coch_op',  String(opCounter));
    localStorage.setItem('coch_esp', JSON.stringify(listaEspera));
    localStorage.setItem('coch_tot', String(TOTAL_COCHERAS));
  }catch(e){}
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(saveToCloud, 2000);
}

async function saveToCloud(){
  setSyncStatus('saving');
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({action:'write', data:{clientes,listaEspera,opCounter,TOTAL_COCHERAS}})
    });
    const j = await res.json();
    setSyncStatus(j.ok ? 'ok' : 'error');
  }catch(e){ setSyncStatus('error'); }
}

async function load(){
  try{
    const c=localStorage.getItem('coch_cli');
    const o=localStorage.getItem('coch_op');
    const e=localStorage.getItem('coch_esp');
    const t=localStorage.getItem('coch_tot');
    if(c) clientes=JSON.parse(c);
    if(o) opCounter=parseInt(o)||1;
    if(e) listaEspera=JSON.parse(e);
    if(t) TOTAL_COCHERAS=parseInt(t)||14;
  }catch(e){}
  try{
    setSyncStatus('saving');
    const res = await fetch(SCRIPT_URL+'?action=read');
    const j   = await res.json();
    if(j.ok && j.data){
      const d = JSON.parse(j.data);
      if(d.clientes)      clientes       = d.clientes;
      if(d.listaEspera)   listaEspera    = d.listaEspera;
      if(d.opCounter)     opCounter      = d.opCounter;
      if(d.TOTAL_COCHERAS) TOTAL_COCHERAS= d.TOTAL_COCHERAS;
      localStorage.setItem('coch_cli', JSON.stringify(clientes));
      localStorage.setItem('coch_op',  String(opCounter));
      localStorage.setItem('coch_esp', JSON.stringify(listaEspera));
      localStorage.setItem('coch_tot', String(TOTAL_COCHERAS));
    }
    setSyncStatus('ok');
  }catch(e){ setSyncStatus('error'); }
  render();
}

function setSyncStatus(s){
  const el=document.getElementById('sync-status'); if(!el) return;
  if(s==='ok')     { el.textContent='☁️ Guardado en Drive'; el.style.color='var(--green)'; }
  if(s==='saving') { el.textContent='⏳ Guardando...';       el.style.color='var(--yellow)'; }
  if(s==='error')  { el.textContent='⚠️ Error al guardar';   el.style.color='var(--red)'; }
}

// ── HELPERS ──
function nextOp(){ const n=opCounter++; save(); return 'OP-'+String(n).padStart(4,'0'); }
function fmt(n){ return '$'+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:0}); }
function fmtDate(s){ if(!s)return''; const[y,m,d]=s.split('-'); return`${d}/${m}/${y}`; }
function today(){ return new Date().toISOString().split('T')[0]; }
function mesNombre(m){ return['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m-1]; }
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function uid(){ return Date.now()+Math.floor(Math.random()*9999); }

function normalizeTel(tel){
  const d=String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('549')) return '+'+d;
  if(d.startsWith('54'))  return '+549'+d.slice(2);
  if(d.startsWith('9')&&d.length>=11) return '+54'+d;
  return '+549'+d;
}
function formatTelDisplay(tel){
  const n=normalizeTel(tel); if(!n) return '—';
  const d=n.replace('+','');
  if(d.length>=12) return '+'+d.slice(0,2)+' '+d.slice(2,3)+' '+d.slice(3,6)+' '+d.slice(6);
  return n;
}

// ── LÓGICA ──
function getSaldo(c){
  let s=c.cocheras.reduce((a,ch)=>a+(parseFloat(ch.saldoInicial)||0),0);
  for(const m of c.movimientos) s+=m.tipo==='cobro'?parseFloat(m.importe):-parseFloat(m.importe);
  return Math.round(s*100)/100;
}
function getCuotaTotal(c){ return c.cocheras.filter(ch=>ch.activa).reduce((a,ch)=>a+(parseFloat(ch.cuota)||0),0); }
function getEstado(c){
  const saldo=getSaldo(c); if(saldo>=0) return 'green';
  const cuota=getCuotaTotal(c)||1;
  const tc=c.movimientos.filter(m=>m.tipo==='cargo').reduce((a,m)=>a+parseFloat(m.importe),0);
  const tb=c.movimientos.filter(m=>m.tipo==='cobro').reduce((a,m)=>a+parseFloat(m.importe),0);
  if((tc-tb)/cuota>=2) return 'red';
  const cargos=[...c.movimientos].filter(m=>m.tipo==='cargo').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let acum=tb; let fi=null;
  for(const cargo of cargos){ if(acum>=parseFloat(cargo.importe)){acum-=parseFloat(cargo.importe);}else{fi=cargo.fecha;break;} }
  if(!fi) return 'yellow';
  return Math.floor((new Date()-new Date(fi))/86400000)>15?'red':'yellow';
}
function getEstadoLabel(e){ return e==='green'?'Al día':e==='yellow'?'≤ 15 días':'2+ cuotas'; }
function getCocherasOcupadas(){ return clientes.filter(c=>c.activo).reduce((a,c)=>a+c.cocheras.filter(ch=>ch.activa).length,0); }
function getCocherasLibres(){ return Math.max(0,TOTAL_COCHERAS-getCocherasOcupadas()); }

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function showView(v,cid=null){
  currentView=v; currentClienteId=cid;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const map={dashboard:'dashboard',clientes:'clientes',cc:'dashboard',ccg:'ccg',espera:'espera'};
  const nb=document.getElementById('nav-'+(map[v]||v));
  if(nb) nb.classList.add('active');
  render();
}

function render(){
  updateAlertBar(); updateFooter();
  const m=document.getElementById('main');
  if(currentView==='dashboard')    m.innerHTML=renderDashboard();
  else if(currentView==='clientes') m.innerHTML=renderClientes();
  else if(currentView==='cc')       m.innerHTML=renderCC(currentClienteId);
  else if(currentView==='ccg')      m.innerHTML=renderCCG();
  else if(currentView==='espera')   m.innerHTML=renderEspera();
}

function updateAlertBar(){
  const act=clientes.filter(c=>c.activo);
  const rojos=act.filter(c=>getEstado(c)==='red');
  const amarillos=act.filter(c=>getEstado(c)==='yellow');
  const bar=document.getElementById('alert-bar');
  if(!rojos.length&&!amarillos.length){bar.style.display='none';return;}
  bar.style.display='flex';
  let p=[];
  if(rojos.length){const t=rojos.reduce((a,c)=>a+Math.abs(getSaldo(c)),0);p.push(`<span style="font-weight:800;color:var(--red);">🔴 ${rojos.length} cliente${rojos.length>1?'s':''} con 2+ cuotas impagas · ${fmt(t)}</span>`);}
  if(amarillos.length) p.push(`<span style="font-weight:700;color:var(--yellow);">🟡 ${amarillos.length} con atraso ≤15 días</span>`);
  bar.innerHTML=`<div class="alert-pulse"></div>${p.join('<span style="color:var(--muted);margin:0 8px;">·</span>')}`;
}

function updateFooter(){
  const now=new Date(); const libres=getCocherasLibres();
  const el=document.getElementById('footer-info');
  if(el) el.textContent=`📅 ${mesNombre(now.getMonth()+1)} ${now.getFullYear()} · ${clientes.filter(c=>c.activo).length} clientes · ${getCocherasOcupadas()}/${TOTAL_COCHERAS} cocheras${libres>0?' · ⚠ '+libres+' libre':''}`;
}

// ── DASHBOARD ──
function renderDashboard(){
  const act=clientes.filter(c=>c.activo);
  if(!act.length) return renderEmpty();
  const now=new Date(); const dia=now.getDate();
  const verdes=act.filter(c=>getEstado(c)==='green').length;
  const amarillos=act.filter(c=>getEstado(c)==='yellow').length;
  const rojos=act.filter(c=>getEstado(c)==='red').length;
  const totalDeuda=act.reduce((a,c)=>{const s=getSaldo(c);return s<0?a+Math.abs(s):a;},0);
  const libres=getCocherasLibres();
  const esperando=listaEspera.filter(e=>e.estado==='esperando').length;
  const sigMes=mesNombre(now.getMonth()===11?1:now.getMonth()+2);
  const factMsg=dia<=2?`⚠️ Hoy es ${dia}° — <strong style="color:var(--copper)">¡Momento de facturar!</strong>`:`Próxima facturación: 1° de ${sigMes}`;

  return `
    <div class="occ-banner">
      <div class="occ-item"><div class="occ-lbl">Total</div><div class="occ-val kv-copper">${TOTAL_COCHERAS}</div></div>
      <div class="occ-item"><div class="occ-lbl">Ocupadas</div><div class="occ-val kv-green">${getCocherasOcupadas()}</div></div>
      <div class="occ-item"><div class="occ-lbl">Libres</div><div class="occ-val ${libres>0?'kv-red':'kv-green'}">${libres}</div></div>
      <div class="occ-item"><div class="occ-lbl">En Espera</div><div class="occ-val ${esperando>0?'kv-yellow':'kv-copper'}">${esperando}</div></div>
    </div>

    ${libres>0?`<div class="libre-alert">🔴 <span>Tenés <strong>${libres} cochera${libres>1?'s':''} libre${libres>1?'s':''}</strong>${esperando>0?` · <strong>${esperando} interesado${esperando>1?'s':''}</strong> en espera`:''}</span>${esperando>0?`<button class="btn btn-sm btn-on" style="margin-left:auto;" onclick="showView('espera')">Ver lista →</button>`:''}</div>`:''}

    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon">👥</div><div class="kpi-label">Clientes Activos</div><div class="kpi-val kv-copper">${act.length}</div></div>
      <div class="kpi-card"><div class="kpi-icon">✅</div><div class="kpi-label">Al día</div><div class="kpi-val kv-green">${verdes}</div></div>
      <div class="kpi-card"><div class="kpi-icon">🟡</div><div class="kpi-label">Atraso leve</div><div class="kpi-val kv-yellow">${amarillos}</div></div>
      <div class="kpi-card"><div class="kpi-icon">🔴</div><div class="kpi-label">2+ cuotas</div><div class="kpi-val kv-red">${rojos}</div></div>
      <div class="kpi-card"><div class="kpi-icon">💰</div><div class="kpi-label">Total adeudado</div><div class="kpi-val kv-red" style="font-size:20px;">${totalDeuda>0?fmt(totalDeuda):'$0'}</div></div>
    </div>

    <div class="fact-banner">
      <div><div class="t">💸 Facturación Mensual</div><div class="s">${factMsg}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="openModal('importar')">📥 Importar Excel</button>
        <button class="btn btn-copper" onclick="openModal('facturar')">💸 Facturar</button>
      </div>
    </div>

    <div class="sec-title">Estado de cuentas · ${mesNombre(now.getMonth()+1)} ${now.getFullYear()}</div>
    ${act.map(c=>{
      const saldo=getSaldo(c); const est=getEstado(c); const cochActivas=c.cocheras.filter(ch=>ch.activa);
      return `
        <div class="client-row st-${est}" onclick="showView('cc',${c.id})">
          <span class="sp ${est}"><div class="sp-dot"></div>${getEstadoLabel(est)}</span>
          <div class="c-info">
            <div class="c-name">${escH(c.nombre)}</div>
            <div class="c-tags">
              ${cochActivas.map(ch=>`<span class="c-tag">🚗 ${escH(ch.auto||'—')} · ${escH(ch.patente||'—')}</span>`).join('')}
              ${c.cocheras.filter(ch=>!ch.activa).map(ch=>`<span class="c-tag inactiva">🚫 ${escH(ch.auto||'—')}</span>`).join('')}
            </div>
          </div>
          <div class="c-saldo">
            <div class="c-saldo-num ${est}">${saldo<0?'−':'+'}${fmt(saldo)}</div>
            <div class="c-saldo-lbl">${saldo<0?'DEBE':'A FAVOR'} · ${fmt(getCuotaTotal(c))}/mes</div>
          </div>
          <div class="c-arrow">›</div>
        </div>`;
    }).join('')}`;
}

function renderEmpty(){
  return `<div class="empty-state"><div class="es-icon">🚗</div><div class="es-title">Sistema listo</div><div class="es-sub">No hay clientes cargados. Importá el Excel o agregá clientes manualmente.</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn btn-copper" onclick="openModal('importar')">📥 Importar Excel</button><button class="btn btn-ghost" onclick="showView('clientes')">+ Agregar cliente</button></div></div>`;
}

// ── CLIENTES ──
function renderClientes(){
  const act=clientes.filter(c=>c.activo);
  const baja=clientes.filter(c=>!c.activo);
  return `
    <div class="page-hdr">
      <h2>👥 Gestión de Clientes</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="openModal('importar')">📥 Importar Excel</button>
        <button class="btn btn-copper" onclick="openModal('form-cliente',null)">+ Nuevo Cliente</button>
      </div>
    </div>
    ${!act.length?`<div class="cc-empty">No hay clientes activos.</div>`:''}
    ${act.map(c=>`
      <div class="manage-row">
        <div class="manage-avatar">👤</div>
        <div class="c-info" style="flex:1;">
          <div class="c-name">${escH(c.nombre)}</div>
          <div class="c-sub">📱 ${formatTelDisplay(c.tel)}</div>
          <div class="c-tags" style="margin-top:6px;">
            ${c.cocheras.map((ch,i)=>`<span class="c-tag ${ch.activa?'':'inactiva'}">${ch.activa?'🚗':'🚫'} ${escH(ch.auto||'—')} · ${escH(ch.patente||'—')} · ${fmt(ch.cuota)}/mes</span>`).join('')}
          </div>
        </div>
        <div class="manage-actions">
          <button class="btn btn-sm btn-on" onclick="showView('cc',${c.id})">📋 CC</button>

// ── CCG ──
function renderCCG(){
  const act=clientes.filter(c=>c.activo);
  if(!act.length) return `<div class="cc-empty" style="padding:60px;">Sin datos.</div>`;
  const allMovs=[];
  act.forEach(c=>c.movimientos.forEach(m=>allMovs.push({...m,clienteNombre:c.nombre})));
  allMovs.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.op.localeCompare(b.op));
  const meses={};
  allMovs.forEach(m=>{const k=m.fecha.substring(0,7);if(!meses[k])meses[k]={movs:[],cargos:0,cobros:0};meses[k].movs.push(m);if(m.tipo==='cargo')meses[k].cargos+=parseFloat(m.importe);else meses[k].cobros+=parseFloat(m.importe);});
  const totalFact=allMovs.filter(m=>m.tipo==='cargo').reduce((a,m)=>a+parseFloat(m.importe),0);
  const totalCob=allMovs.filter(m=>m.tipo==='cobro').reduce((a,m)=>a+parseFloat(m.importe),0);
  const totalDeuda=act.reduce((a,c)=>{const s=getSaldo(c);return s<0?a+Math.abs(s):a;},0);
  let rows='';
  Object.keys(meses).sort().forEach(key=>{
    const[y,mm]=key.split('-'); const b=meses[key]; const pend=b.cargos-b.cobros;
    rows+=`<div class="ccg-sep"><span>📅  ${mesNombre(parseInt(mm))} ${y}</span><span style="font-size:10px;font-weight:600;color:var(--muted);">Cargos: ${fmt(b.cargos)} &nbsp;·&nbsp; Cobros: ${fmt(b.cobros)} &nbsp;·&nbsp; <span style="color:${pend>0?'var(--red)':'var(--green)'};">${pend>0?'Pendiente: '+fmt(pend):'✅ Saldado'}</span></span></div>`;
    b.movs.forEach((m,i)=>{
      rows+=`<div class="ccg-trow" style="background:${i%2===0?'var(--card)':'var(--card2)'};">
        <div style="font-size:10px;font-weight:700;color:var(--muted);">${escH(m.op||'')}</div>
        <div style="color:var(--muted);font-size:12px;">${fmtDate(m.fecha)}</div>
        <div style="font-weight:700;font-size:13px;color:var(--copper);">${escH(m.clienteNombre)}</div>
        <div style="font-size:12px;color:var(--muted);">${escH(m.concepto)}</div>
        <div style="font-size:11px;color:var(--muted);">${escH(m.comprobante||'—')}</div>
        <div style="font-size:11px;color:var(--muted);">${escH(m.modo||'—')}</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;text-align:right;color:${m.tipo==='cargo'?'var(--red)':'var(--green)'};">${m.tipo==='cargo'?'−':'+'}${fmt(m.importe)}</div>
        <div style="text-align:center;"><span class="badge ${m.tipo}">${m.tipo==='cobro'?'✅ Cobro':'📋 Cargo'}</span></div>
      </div>`;
    });
    rows+=`<div class="ccg-sub"><span style="color:var(--muted);font-size:11px;">Subtotal ${mesNombre(parseInt(mm))}:</span><span style="color:var(--red);font-family:'Syne',sans-serif;">Cargos: ${fmt(b.cargos)}</span><span style="color:var(--green);font-family:'Syne',sans-serif;">Cobros: ${fmt(b.cobros)}</span><span style="color:${pend>0?'var(--red)':'var(--green)'};font-family:'Syne',sans-serif;font-weight:900;">${pend>0?'Pendiente: −'+fmt(pend):'✅ Saldado'}</span></div>`;
  });
  return `
    <div class="page-hdr"><h2>📋 Cuenta Corriente General</h2><button class="btn btn-ghost btn-sm" onclick="exportarPDFGeneral()">⬇️ Exportar PDF</button></div>
    <div class="kpi-grid" style="margin-bottom:20px;">
      <div class="kpi-card"><div class="kpi-icon">💸</div><div class="kpi-label">Total Facturado</div><div class="kpi-val kv-copper" style="font-size:20px;">${fmt(totalFact)}</div></div>
      <div class="kpi-card"><div class="kpi-icon">✅</div><div class="kpi-label">Total Cobrado</div><div class="kpi-val kv-green" style="font-size:20px;">${fmt(totalCob)}</div></div>
      <div class="kpi-card"><div class="kpi-icon">⚠️</div><div class="kpi-label">Deuda Global</div><div class="kpi-val kv-red" style="font-size:20px;">${totalDeuda>0?fmt(totalDeuda):'$0'}</div></div>
    </div>
    <div class="cc-table">
      <div class="ccg-thead"><div>N° Op.</div><div>Fecha</div><div>Cliente</div><div>Concepto</div><div>Comprobante</div><div>Modo</div><div style="text-align:right;">Importe</div><div style="text-align:center;">Tipo</div></div>
      ${rows||`<div class="cc-empty">Sin movimientos.</div>`}
      <div class="ccg-total">
        <div class="ccg-chip"><div class="cl">Facturado</div><div class="cv">${fmt(totalFact)}</div></div>
        <div class="ccg-chip"><div class="cl">Cobrado</div><div class="cv" style="color:var(--green);">${fmt(totalCob)}</div></div>
        <div class="ccg-chip"><div class="cl">Deuda Global</div><div class="cv" style="color:var(--red);">${totalDeuda>0?'−'+fmt(totalDeuda):'$0'}</div></div>
      </div>
    </div>`;
}

function openModal(tipo, param=null){

    <div class="import-zone" onclick="document.getElementById('file-inp').click()">
      <div class="iz-icon">📂</div><div class="iz-title">Seleccionar archivo Excel</div><div class="iz-sub">.xlsx o .xls</div>
      <input type="file" id="file-inp" accept=".xlsx,.xls" style="display:none;" onchange="procesarExcel(this)">

    html=`<div class="modal-icon">💸</div><div class="modal-title">Facturación · ${mes} ${now.getFullYear()}</div>
    <div class="modal-sub">Paso 1 de 2 — Ingresá el valor de la cuota para este mes.</div>
    <div class="field" style="margin-bottom:20px;">
      <label>💰 Valor de la cuota este mes ($)</label>
      <input id="inp-cuota-mes" type="number" value="${cuotaBase}" placeholder="50000" style="font-size:22px;font-weight:800;color:var(--copper);">

    </div>
    <div id="check-list" style="max-height:220px;overflow-y:auto;">

        const saldo=getSaldo(c); const est=getEstado(c); const cochActivas=c.cocheras.filter(ch=>ch.activa);
        return `<div class="check-item checked" id="chk-wrap-${c.id}" onclick="toggleCheck(${c.id})">
          <input type="checkbox" id="chk-${c.id}" checked onclick="event.stopPropagation();toggleCheck(${c.id})">

            <div class="cn">${escH(c.nombre)}</div>

          </div>
          <div class="csaldo" style="color:var(--${est});">${saldo<0?'−':'+'}${fmt(saldo)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-copper" onclick="facturarPreview()">Siguiente → Paso 2</button></div>`;
  }

  }

function montarModal(html, wide=false){
  const ov=document.createElement('div'); ov.className='modal-overlay'; ov.id='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  const m=document.createElement('div'); m.className='modal'+(wide?' wide':''); m.innerHTML=html;
  ov.appendChild(m); document.body.appendChild(ov);
}
function closeModal(){ const o=document.getElementById('modal-overlay'); if(o)o.remove(); }

  const now=new Date(); const mes=mesNombre(now.getMonth()+1); const año=now.getFullYear();

    const cochActivas=c.cocheras.filter(ch=>ch.activa);
    cochActivas.forEach(ch=>{
      ch.cuota=cuotaMes;

        op:nextOp(), fecha:today(),

function buildWAMsg(c){
  const now=new Date(); const mes=mesNombre(now.getMonth()+1); const año=now.getFullYear();
  const saldo=getSaldo(c); const est=getEstado(c);
  const cochActivas=c.cocheras.filter(ch=>ch.activa);
  const movs=[...c.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-6);
  let msg=`🚗 *COCHERA — Resumen de Cuenta*\n━━━━━━━━━━━━━━━━━\n`;
  msg+=`👤 *${c.nombre}*\n📱 ${formatTelDisplay(c.tel)}\n📅 ${mes} ${año}\n`;
  if(cochActivas.length>1){msg+=`\n🚗 *COCHERAS:*\n`;cochActivas.forEach((ch,i)=>{msg+=`   ${i+1}. ${ch.auto||'—'} · ${ch.patente||'—'} · ${fmt(ch.cuota)}/mes\n`;});msg+=`   *Cuota total: ${fmt(getCuotaTotal(c))}/mes*\n`;}
  else if(cochActivas.length===1){msg+=`🚙 ${cochActivas[0].auto||'—'} · ${cochActivas[0].patente||'—'} · ${fmt(cochActivas[0].cuota)}/mes\n`;}
  msg+=`━━━━━━━━━━━━━━━━━\n\n📋 *ÚLTIMOS MOVIMIENTOS*\n\n`;
  if(!movs.length){msg+=`_Sin movimientos_\n`;}
  else{movs.forEach(m=>{msg+=`${m.tipo==='cobro'?'✅ +':'📋 −'}${fmt(m.importe)} · ${fmtDate(m.fecha)}\n   _${m.concepto}_${m.comprobante?` (${m.comprobante})`:''}\n`;});}
  msg+=`\n━━━━━━━━━━━━━━━━━\n`;
  if(saldo<0){msg+=est==='yellow'?`⚠️ *Atraso leve — Saldo: −${fmt(saldo)}*\n`:`🔴 *2+ cuotas impagas — Saldo: −${fmt(saldo)}*\n`;msg+=`_Por favor regularizá tu cuenta._\n`;}
  else{msg+=`✅ *Al día — Saldo: +${fmt(saldo)}*\n`;}
  msg+=`━━━━━━━━━━━━━━━━━\n_Cochera · R. Sáenz Peña · Baradero_`;
  return msg;
}

function abrirWA(id){
  const c=clientes.find(x=>x.id===id);

  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
  closeModal(); showToast(`📱 WhatsApp para ${c.nombre}`);
}

async function procesarExcel(input){
  const file=input.files[0]; if(!file) return;
  const st=document.getElementById('import-status');
  st.style.display='block'; st.style.background='var(--copper-dim)'; st.style.color='var(--copper)'; st.textContent='⏳ Procesando...';
  try{
    if(!window.XLSX){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array',cellDates:true});
    const sh1=wb.Sheets[wb.SheetNames[0]];
    const rows1=XLSX.utils.sheet_to_json(sh1,{header:1,defval:''});
    const nuevos=[];
    for(let i=3;i<rows1.length;i++){
      const r=rows1[i];
      const nombre=String(r[0]||'').trim();
      if(!nombre||nombre.startsWith('⚠')) continue;
      const tel=normalizeTel(String(r[1]||'').replace(/\D/g,'')).replace('+','');
      const cocheras=[];
      for(let ci=0;ci<3;ci++){
        const base=2+ci*4;
        const cuota=parseFloat(r[base+2])||0;
        if(!cuota) break;
        cocheras.push({id:uid(),auto:String(r[base]||'').trim(),patente:String(r[base+1]||'').trim(),cuota,saldoInicial:parseFloat(r[base+3])||0,activa:true});
      }
      if(!cocheras.length) cocheras.push({id:uid(),auto:'',patente:'',cuota:0,saldoInicial:0,activa:true});
      nuevos.push({id:uid(),nombre,tel,activo:true,cocheras,movimientos:[]});
    }
    const movsPorNombre={};
    if(wb.SheetNames.length>1){
      const sh2=wb.Sheets[wb.SheetNames[1]];
      const rows2=XLSX.utils.sheet_to_json(sh2,{header:1,defval:''});
      for(let i=3;i<rows2.length;i++){
        const r=rows2[i];
        let fechaRaw=r[0]; let fecha='';
        if(fechaRaw instanceof Date){fecha=fechaRaw.toISOString().split('T')[0];}
        else{const s=String(fechaRaw||'').trim();if(s.includes('/')){const p=s.split('/');fecha=`${p[2].length===4?p[2]:'20'+p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}else{fecha=s;}}
        if(!fecha) continue;
        const nom=String(r[1]||'').trim(); if(!nom) continue;
        const concepto=String(r[2]||'').trim();
        const tipo=String(r[3]||'').toLowerCase().includes('cobro')?'cobro':'cargo';
        const modo=String(r[4]||'').trim()||'—';
        const comprobante=String(r[5]||'').trim();
        const importe=parseFloat(r[6])||0; if(!importe) continue;
        if(!movsPorNombre[nom]) movsPorNombre[nom]=[];
        movsPorNombre[nom].push({op:'',fecha,concepto,modo,comprobante,obs:'',importe,tipo});
      }
    }
    nuevos.forEach(c=>{
      const movs=movsPorNombre[c.nombre]||[];
      movs.sort((a,b)=>a.fecha.localeCompare(b.fecha));
      movs.forEach(m=>{m.op=nextOp();});
      c.movimientos=movs;
    });
    clientes=nuevos; save();
    st.style.background='var(--green-dim)'; st.style.color='var(--green)';
    st.textContent=`✅ Importado: ${nuevos.length} clientes`;
    setTimeout(()=>{closeModal();render();},1500);
  }catch(err){
    st.style.background='var(--red-dim)'; st.style.color='var(--red)';
    st.textContent=`❌ Error: ${err.message}`;
  }
}

async function cargarJsPDF(){
  if(window.jspdf) return;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
}

async function exportarPDF(cid){

  const copper=[201,149,108]; const green=[52,211,153]; const red=[248,113,113];

  doc.text('COCHERA',14,21);
  doc.setFontSize(7); doc.setFont('helvetica','normal');
  doc.setTextColor(...gray); doc.text('R. SÁENZ PEÑA · BARADERO',14,26);
  doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.setTextColor(...white); doc.text('CUENTA CORRIENTE',200,19,{align:'right'});
  doc.setFontSize(7); doc.setFont('helvetica','normal');
  doc.setTextColor(...gray); doc.text('RESUMEN INDIVIDUAL',200,25,{align:'right'});

  doc.setFillColor(30,30,30); doc.roundedRect(10,32,190,14,2,2,'F');
  doc.setTextColor(...gray); doc.setFontSize(6); doc.setFont('helvetica','bold');
  doc.text('CLIENTE',13,38); doc.text('TELÉFONO',80,38); doc.text('PERÍODO',140,38); doc.text('CUOTA TOTAL',175,38);
  doc.setTextColor(...copper); doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text(c.nombre,13,44);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...light);

  doc.setFillColor(...scL); doc.roundedRect(10,50,190,16,2,2,'F');

  doc.text('SALDO ACTUAL',105,56,{align:'center'});
  doc.setFontSize(20); doc.text(`${saldo<0?'− ':'+ '}${fmt(saldo)}`,105,65,{align:'center'});

  const movs=[...c.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  doc.autoTable({
    startY:70,
    head:[['N° Op.','Fecha','Concepto','Comprobante','Modo de Pago','Cargo','Cobro']],
    body:movs.map(m=>[m.op||'',fmtDate(m.fecha),m.concepto,m.comprobante||'—',m.modo||'—',m.tipo==='cargo'?fmt(m.importe):'',m.tipo==='cobro'?fmt(m.importe):'']),
    foot:[[{content:'Saldo Final:',colSpan:5,styles:{halign:'right',fontStyle:'bold',fillColor:scL,textColor:sc}},{content:`${saldo<0?'−':'+'}${fmt(saldo)}`,colSpan:2,styles:{halign:'right',fontStyle:'bold',fillColor:scL,textColor:sc}}]],
    styles:{fontSize:8,cellPadding:3,textColor:light,fillColor:[30,30,30]},
    headStyles:{fillColor:[10,10,10],textColor:copper,fontStyle:'bold',fontSize:7},

    alternateRowStyles:{fillColor:[25,25,25]},showFoot:'lastPage',margin:{left:10,right:10},

  doc.save(`CC_${c.nombre.replace(/ /g,'_')}_${mesNombre(now.getMonth()+1)}${now.getFullYear()}.pdf`);
  showToast('✅ PDF descargado');
}

async function exportarPDFGeneral(){
  showToast('⏳ Generando PDF...'); await cargarJsPDF();
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  const copper=[201,149,108]; const green=[52,211,153]; const red=[248,113,113];
  const dark=[26,26,26]; const gray=[85,85,85]; const light=[224,216,208]; const white=[255,255,255];
  const act=clientes.filter(c=>c.activo);
  const allMovs=[];
  act.forEach(c=>c.movimientos.forEach(m=>allMovs.push({...m,clienteNombre:c.nombre})));
  allMovs.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const meses={};
  allMovs.forEach(m=>{const k=m.fecha.substring(0,7);if(!meses[k])meses[k]=[];meses[k].push(m);});
  const totalFact=allMovs.filter(m=>m.tipo==='cargo').reduce((a,m)=>a+m.importe,0);
  const totalCob=allMovs.filter(m=>m.tipo==='cobro').reduce((a,m)=>a+m.importe,0);
  const totalDeuda=act.reduce((a,c)=>{const s=getSaldo(c);return s<0?a+Math.abs(s):a;},0);

  doc.setFillColor(...dark); doc.rect(0,0,210,297,'F');
  doc.setFillColor(10,10,10); doc.roundedRect(10,10,190,18,3,3,'F');
  doc.setTextColor(...white); doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text('COCHERA',14,21);
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...gray); doc.text('R. SÁENZ PEÑA · BARADERO',14,26);
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...white); doc.text('CC GENERAL',200,19,{align:'right'});
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...gray); doc.text('TODOS LOS CLIENTES',200,25,{align:'right'});

  doc.setFillColor(30,30,30); doc.roundedRect(10,32,190,12,2,2,'F');
  doc.setFontSize(6); doc.setFont('helvetica','bold'); doc.setTextColor(...gray);
  doc.text('TOTAL FACTURADO',40,37,{align:'center'}); doc.text('TOTAL COBRADO',105,37,{align:'center'}); doc.text('DEUDA GLOBAL',170,37,{align:'center'});
  doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.setTextColor(...copper); doc.text(fmt(totalFact),40,43,{align:'center'});
  doc.setTextColor(...green); doc.text(fmt(totalCob),105,43,{align:'center'});
  doc.setTextColor(...red); doc.text(totalDeuda>0?'−'+fmt(totalDeuda):'$0',170,43,{align:'center'});

  const bodyRows=[];
  Object.keys(meses).sort().forEach(key=>{
    const[y,mm]=key.split('-');
    bodyRows.push([{content:`📅  ${mesNombre(parseInt(mm))} ${y}`,colSpan:7,styles:{fillColor:[10,10,10],textColor:copper,fontStyle:'bold',fontSize:8}}]);
    meses[key].forEach(m=>{bodyRows.push([m.op||'',fmtDate(m.fecha),m.clienteNombre,m.concepto,m.comprobante||'—',m.modo||'—',`${m.tipo==='cargo'?'−':'+'}${fmt(m.importe)}`]);});
    const cg=meses[key].filter(m=>m.tipo==='cargo').reduce((a,m)=>a+m.importe,0);
    const cb=meses[key].filter(m=>m.tipo==='cobro').reduce((a,m)=>a+m.importe,0);
    const pd=cg-cb;
    bodyRows.push([{content:`Subtotal ${mesNombre(parseInt(mm))}: Cargos ${fmt(cg)} · Cobros ${fmt(cb)} · ${pd>0?'Pendiente: −'+fmt(pd):'✅ Saldado'}`,colSpan:7,styles:{fillColor:[15,15,15],textColor:pd>0?red:green,fontStyle:'bold',fontSize:7,halign:'right'}}]);
  });

  doc.autoTable({
    startY:48,
    head:[['N° Op.','Fecha','Cliente','Concepto','Comprobante','Modo','Importe']],
    body:bodyRows,
    foot:[[{content:`TOTAL — Facturado: ${fmt(totalFact)} · Cobrado: ${fmt(totalCob)} · Deuda: ${totalDeuda>0?'−'+fmt(totalDeuda):'$0'}`,colSpan:7,styles:{fillColor:[10,10,10],textColor:copper,fontStyle:'bold',fontSize:8,halign:'right'}}]],
    styles:{fontSize:7,cellPadding:2.5,textColor:light,fillColor:[30,30,30]},
    headStyles:{fillColor:[10,10,10],textColor:copper,fontStyle:'bold',fontSize:6},
    columnStyles:{0:{cellWidth:16,textColor:gray},1:{cellWidth:18},2:{cellWidth:32,fontStyle:'bold',textColor:copper},3:{cellWidth:46},4:{cellWidth:22,halign:'center'},5:{cellWidth:22,halign:'center'},6:{cellWidth:20,halign:'right'}},
    alternateRowStyles:{fillColor:[25,25,25]},showFoot:'lastPage',margin:{left:10,right:10},
  });
  const py=doc.lastAutoTable.finalY+6;
  doc.setDrawColor(...gray); doc.line(10,py,200,py);
  doc.setFontSize(7); doc.setTextColor(...gray); doc.setFont('helvetica','normal');
  doc.text('Cochera · R. Sáenz Peña · Baradero',10,py+5);
  doc.text(`Emitido: ${now.toLocaleDateString('es-AR')} | Generado automáticamente`,200,py+5,{align:'right'});
  doc.save(`CC_General_${mesNombre(now.getMonth()+1)}${now.getFullYear()}.pdf`);
  showToast('✅ PDF General descargado');
}

// ── TOAST ──
function showToast(msg,ok=true){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast '+(ok?'ok':'err');
  t.style.display='block'; if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.display='none';},3200);
}

// ── AVISO FACTURACIÓN ──
function checkFacturacion(){
  if(!clientes.filter(c=>c.activo).length) return;
  const dia=new Date().getDate();
  if(dia===1||dia===2){
    const mes=mesNombre(new Date().getMonth()+1);
    setTimeout(()=>{if(confirm(`🚗 COCHERA · Recordatorio\n\nHoy es ${dia}° de ${mes}.\n¿Querés facturar la mensualidad ahora?`))openModal('facturar');},800);
  }
}

load().then(()=>{ render(); checkFacturacion(); });
